name: Promote verified Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag, for example v2.1.0-beta.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: promote-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  promote:
    name: Verify evidence and publish draft
    runs-on: windows-latest
    timeout-minutes: 20
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      WIN_SIGNING_PUBLISHER: ${{ vars.WIN_SIGNING_PUBLISHER }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release evidence
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Verify tag and signed-off hardware matrix
        id: candidate
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }
          $version = $Matches.version
          git fetch --force origin "refs/tags/$($env:RELEASE_TAG):refs/tags/$($env:RELEASE_TAG)"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to fetch tag $env:RELEASE_TAG"
          }
          $sourceCommit = (git rev-parse "$($env:RELEASE_TAG)^{commit}").Trim()
          node scripts/verify-hardware-matrix.js --version $version --source-commit $sourceCommit
          if ($LASTEXITCODE -ne 0) {
            throw 'Hardware evidence verification failed'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download and verify draft assets
        shell: pwsh
        run: |
          $release = gh release view $env:RELEASE_TAG --json isDraft,tagName | ConvertFrom-Json
          if (-not $release.isDraft) {
            throw "$env:RELEASE_TAG is not a draft release"
          }
          $downloadDir = Join-Path $env:RUNNER_TEMP "highlighter-$($env:GITHUB_RUN_ID)"
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          gh release download $env:RELEASE_TAG --dir $downloadDir
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to download assets for $env:RELEASE_TAG"
          }
          & ./scripts/verify-promotion-assets.ps1 `
            -DistDir $downloadDir `
            -ExpectedVersion '${{ steps.candidate.outputs.version }}' `
            -ExpectedPublisher $env:WIN_SIGNING_PUBLISHER

      - name: Publish verified release
        shell: pwsh
        run: |
          if ('${{ steps.candidate.outputs.version }}' -match '-') {
            gh release edit $env:RELEASE_TAG --draft=false
          } else {
            gh release edit $env:RELEASE_TAG --draft=false --latest
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to publish $env:RELEASE_TAG"
          }
