name: Windows CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Check and test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Check package version
        run: npm run check:version

      - name: Run tests
        run: npm test

      - name: Run long capture regression tests
        run: npm run test:long-capture

  package:
    name: Build hardened unsigned candidate
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/ocr

      - name: Install dependencies
        run: npm ci

      - name: Build native helpers
        run: npm run build:native

      - name: Verify strict Electron runtime
        shell: pwsh
        run: |
          $env:HIGHLIGHTER_REQUIRE_NATIVE_RUNTIME = '1'
          npm run test:runtime

      - name: Build unsigned NSIS and portable candidates
        shell: pwsh
        run: |
          $electronDist = (Resolve-Path 'node_modules/electron/dist').Path
          npx electron-builder --config electron-builder.release.cjs --win nsis portable --x64 --publish never "--config.electronDist=$electronDist" --config.forceCodeSigning=false --config.win.signExecutable=false

      - name: Generate CycloneDX SBOM
        shell: pwsh
        run: npm sbom --sbom-format cyclonedx | Out-File -FilePath dist/sbom.cdx.json -Encoding utf8

      - name: Verify candidate artifacts
        run: npm run verify:package

      - name: Upload verified candidates
        uses: actions/upload-artifact@v4
        with:
          name: Highlighter-Windows-${{ github.sha }}
          path: |
            dist/Highlighter-Setup-*.exe
            dist/Highlighter-*-portable.exe
            dist/*.blockmap
            dist/latest*.yml
            dist/beta*.yml
            dist/alpha*.yml
            dist/SHA256SUMS.txt
            dist/sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
