name: Windows CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Check and test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Check package version
        run: npm run check:version

      # The package job skips PRs. On pushes/dispatches its native build and
      # artifact verification cover this helper without a second publish here.
      - name: Set up .NET SDK for PR helper build
        if: github.event_name == 'pull_request'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'

      - name: Build and smoke-test device battery helper (no hardware)
        if: github.event_name == 'pull_request'
        run: npm run build:device-battery -- -Verify

      - name: Run tests
        run: npm test

      # E01 (docs/plans/2026-11-28-review-optimization-follow-up-tasks.md section 6):
      # the usage-query p95 assertions are load-sensitive, and the full suite starts
      # many processes at once. This step re-measures the timing-sensitive files one
      # at a time with the original budgets so a commit can be compared on numbers
      # instead of a flaky red. The full suite above still runs the same tests once.
      - name: Run isolated performance gate
        # Always: the perf numbers are the E01 diagnostic, and a known CI-only test
        # failure earlier in this job must not hide them.
        if: always()
        run: node scripts/run-perf-gate.js --out perf-gate.json
        timeout-minutes: 8

      - name: Upload performance gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-result
          path: perf-gate.json
          if-no-files-found: ignore

      - name: Run renderer E2E
        run: npm run test:e2e

      - name: Enforce coverage thresholds
        run: npm run test:coverage

      - name: Run long capture regression tests
        run: npm run test:long-capture

      # Deliberately last: a dependency advisory must not mask test results. Five
      # consecutive runs (2026-11-03 .. 2026-11-06) failed here first and skipped
      # every test step behind it, so CI stayed red for days without anyone
      # learning whether the tests still passed.
      - name: Audit production and build dependencies
        run: npm run audit:dependencies

  package:
    name: Build hardened unsigned candidate
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/ocr

      - name: Install dependencies
        run: npm ci

      - name: Build native helpers
        run: npm run build:native

      - name: Verify strict Electron runtime
        shell: pwsh
        run: |
          $env:HIGHLIGHTER_REQUIRE_NATIVE_RUNTIME = '1'
          $env:HIGHLIGHTER_REQUIRE_CAPTURE_RUNTIME = '1'
          npm run test:runtime

      - name: Build unsigned NSIS and portable candidates
        shell: pwsh
        run: |
          $electronDist = (Resolve-Path 'node_modules/electron/dist').Path
          npx electron-builder --config electron-builder.release.cjs --win nsis portable --x64 --publish never "--config.electronDist=$electronDist" --config.forceCodeSigning=false --config.win.signExecutable=false

      - name: Generate CycloneDX SBOM
        shell: pwsh
        run: npm sbom --sbom-format cyclonedx | Out-File -FilePath dist/sbom.cdx.json -Encoding utf8

      - name: Verify candidate artifacts
        run: npm run verify:package

      - name: Upload verified candidates
        uses: actions/upload-artifact@v4
        with:
          name: Highlighter-Windows-${{ github.sha }}
          path: |
            dist/Highlighter-Setup-*.exe
            dist/Highlighter-*-portable.exe
            dist/*.blockmap
            dist/latest*.yml
            dist/beta*.yml
            dist/alpha*.yml
            dist/SHA256SUMS.txt
            dist/sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
