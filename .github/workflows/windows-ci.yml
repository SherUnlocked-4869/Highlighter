name: Windows CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Check and test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run tests
        run: npm test

  package:
    name: Build unsigned installer
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/ocr

      - name: Install dependencies
        run: npm ci

      - name: Build native helpers
        run: npm run build:native

      - name: Build installer with local Electron
        shell: pwsh
        run: |
          $electronDist = (Resolve-Path 'node_modules/electron/dist').Path
          npx electron-builder --win nsis --x64 --publish never "-c.electronDist=$electronDist"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Highlighter-Windows-${{ github.sha }}
          path: |
            dist/Highlighter-Setup-*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 14
