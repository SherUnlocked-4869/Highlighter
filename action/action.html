<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>划词助手</title>
<style>
  :root {
    --primary: #1677ff;
    --inline-code: var(--primary);
    --bg: #f5f5f5;
    --panel: #fff;
    --panel-soft: #fafafa;
    --text: #1f1f1f;
    --muted: #777;
    --line: #e8e8e8;
    --reasoning-bg: #f0f1f3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  body.dark {
    --inline-code: #ff9f43;
    --bg: #121316;
    --panel: #1b1c20;
    --panel-soft: #23252a;
    --text: #f0f0f0;
    --muted: #999;
    --line: #303239;
    --reasoning-bg: #17181c;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .header .icon {
    font-size: 20px;
  }
  .header .title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    flex: 1;
  }
  .header .badge {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 10px;
    background: color-mix(in srgb, var(--primary) 12%, transparent);
    color: var(--primary);
    border: 1px solid color-mix(in srgb, var(--primary) 28%, transparent);
  }
  .header .badge.explain {
    background: color-mix(in srgb, var(--primary) 12%, transparent);
    color: var(--primary);
    border-color: color-mix(in srgb, var(--primary) 28%, transparent);
  }
  .pin-btn {
    background: none; border: 1px solid transparent; color: var(--muted);
    font-size: 16px; cursor: pointer; padding: 4px 8px; border-radius: 6px;
    line-height: 1; transition: all 0.15s; outline: none;
    -webkit-app-region: no-drag;
  }
  .pin-btn:hover { background: color-mix(in srgb, var(--primary) 8%, transparent); color: var(--text); }
  .pin-btn.pinned { color: var(--primary); border-color: color-mix(in srgb, var(--primary) 28%, transparent); background: color-mix(in srgb, var(--primary) 9%, transparent); }
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    line-height: 1.8;
    font-size: 14px;
  }
  .content .source {
    background: var(--panel-soft);
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 13px;
    color: var(--muted);
    border-left: 3px solid var(--primary);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .content .result {
    word-break: break-word;
    line-height: 1.7;
  }
  /* Markdown styles */
  .result h1, .result h2, .result h3, .result h4 { color: var(--text); margin: 16px 0 8px; font-weight: 600; }
  .result h1 { font-size: 1.4em; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .result h2 { font-size: 1.2em; }
  .result h3 { font-size: 1.1em; }
  .result p { margin: 6px 0; }
  .result ul, .result ol { padding-left: 24px; margin: 6px 0; }
  .result li { margin: 4px 0; }
  .result code { background: var(--panel-soft); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; color: var(--inline-code); }
  .result pre { background: var(--reasoning-bg); padding: 14px 16px; border-radius: 8px; overflow-x: auto; margin: 10px 0; border: 1px solid var(--line); }
  .result pre code { background: none; padding: 0; color: var(--text); }
  .result blockquote { border-left: 3px solid var(--primary); padding-left: 14px; margin: 10px 0; color: var(--muted); }
  .result strong { color: var(--text); }
  .result a { color: var(--primary); }
  .result table { border-collapse: collapse; margin: 10px 0; width: 100%; }
  .result th, .result td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; }
  .result th { background: var(--panel-soft); }
  .result hr { border: none; border-top: 1px solid var(--line); margin: 16px 0; }
  .reasoning-arrow { font-size: 11px; transition: transform 0.2s; }
  .reasoning-box.open .reasoning-arrow { transform: rotate(0deg); }
  /* Thin scrollbar */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted) 45%, transparent); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--muted) 65%, transparent); }
  .reasoning-preview::-webkit-scrollbar { width: 4px; }
  .reasoning-preview::-webkit-scrollbar-thumb { background: var(--line); }
  .reasoning-full::-webkit-scrollbar { width: 4px; }
  .reasoning-full::-webkit-scrollbar-thumb { background: var(--line); }
  .content .reasoning-box {
    background: var(--reasoning-bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .content .reasoning-box .reasoning-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .content .reasoning-box .reasoning-header:hover {
    background: color-mix(in srgb, var(--primary) 5%, transparent);
  }
  .content .reasoning-box .reasoning-preview {
    padding: 0 14px 10px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    max-height: 60px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .content .reasoning-box .reasoning-full {
    padding: 0 14px 14px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
    display: none;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .content .reasoning-box.open .reasoning-full {
    display: block;
  }
  .content .reasoning-box.open .reasoning-preview {
    display: none;
  }
  .loading {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 20px;
    color: var(--muted);
    font-size: 13px;
  }
  .loading .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid var(--line);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .cursor {
    display: inline-block;
    width: 2px;
    height: 15px;
    background: var(--primary);
    margin-left: 2px;
    animation: blink 0.8s infinite;
    vertical-align: text-bottom;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="header">
  <span class="icon" id="headerIcon">🌐</span>
  <span class="title" id="headerTitle">翻译中...</span>
  <span class="badge" id="headerBadge">翻译</span>
  <span style="flex:1"></span>
  <div class="header-actions">
    <button class="pin-btn" id="btnPin" title="置顶">📌</button>
  </div>
</div>
<div class="content" id="content">
  <div class="source" id="sourceText"></div>
  <div class="result" id="result"></div>
  <div id="scrollSentinel" style="height:1px;width:1px;"></div>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <span id="loadingText">正在请求 DeepSeek...</span>
  </div>
</div>

<script src="action.js"></script>
</body>
</html>
