<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'none'; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>划词助手</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="action.css">
</head>
<body>
<div class="header">
  <!-- Inline SVG rather than emoji: this window's CSP is img-src 'none', so a
       mask-image icon cannot be used, and emoji render inconsistently across
       Windows font versions. -->
  <span class="icon" id="headerIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg></span>
  <span class="title" id="headerTitle">翻译中...</span>
  <span class="badge" id="headerBadge">翻译</span>
  <span class="header-spacer"></span>
  <div class="header-actions">
    <button class="pin-btn" id="btnPin" title="置顶" aria-label="置顶"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 6 3 3v2H7v-2l3-3-1-6Z"/><path d="M12 15v5"/></svg></button>
  </div>
</div>
<div class="content" id="content">
  <div class="source" id="sourceText"></div>
  <div class="result" id="result"></div>
  <div id="scrollSentinel" class="scroll-sentinel"></div>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <span id="loadingText">正在请求 DeepSeek...</span>
  </div>
</div>

<script src="../node_modules/dompurify/dist/purify.min.js"></script>
<script src="action.js"></script>
</body>
</html>
