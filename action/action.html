<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'none'; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>划词助手</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="action.css">
</head>
<body>
<div class="header">
  <span class="icon" id="headerIcon">🌐</span>
  <span class="title" id="headerTitle">翻译中...</span>
  <span class="badge" id="headerBadge">翻译</span>
  <span class="header-spacer"></span>
  <div class="header-actions">
    <button class="pin-btn" id="btnPin" title="置顶">📌</button>
  </div>
</div>
<div class="content" id="content">
  <div class="source" id="sourceText"></div>
  <div class="result" id="result"></div>
  <div id="scrollSentinel" class="scroll-sentinel"></div>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <span id="loadingText">正在请求 DeepSeek...</span>
  </div>
</div>

<script src="../node_modules/dompurify/dist/purify.min.js"></script>
<script src="action.js"></script>
</body>
</html>
