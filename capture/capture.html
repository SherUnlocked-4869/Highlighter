<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-i18n="capture.window.title"></title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="capture.css">
</head>
<body>
  <canvas id="backgroundStage"></canvas>
  <canvas id="stage"></canvas>
  <div id="ocrOverlay" class="ocr-overlay hidden"></div>
  <div id="tip" data-i18n="capture.tip.drag"></div>
  <div id="sizeBadge"></div>
  <div id="toolbar" class="toolbar hidden">
    <!-- B1 (D5/D6): the strip is a column container. Row 1 keeps every control that
         shipped before, row 2 (#toolOptions) carries only the new per-tool options
         and stays hidden while a tool has none. -->
    <div class="toolbar-row">
      <div class="tool-group">
        <button data-tool="select" class="active" data-i18n-title="capture.toolbar.select-tip" data-i18n-aria-label="capture.toolbar.select"><span class="toolbar-icon" style="--icon:url('icons/select.svg')" aria-hidden="true"></span></button>
        <button data-tool="rect" data-i18n-title="capture.toolbar.rect" data-i18n-aria-label="capture.toolbar.rect"><span class="toolbar-icon" style="--icon:url('icons/rect.svg')" aria-hidden="true"></span></button>
        <button data-tool="ellipse" data-i18n-title="capture.toolbar.ellipse" data-i18n-aria-label="capture.toolbar.ellipse"><span class="toolbar-icon" style="--icon:url('icons/ellipse.svg')" aria-hidden="true"></span></button>
        <button data-tool="arrow" data-i18n-title="capture.toolbar.arrow" data-i18n-aria-label="capture.toolbar.arrow"><span class="toolbar-icon" style="--icon:url('icons/arrow.svg')" aria-hidden="true"></span></button>
        <button data-tool="line" data-i18n-title="capture.toolbar.line" data-i18n-aria-label="capture.toolbar.line"><span class="toolbar-icon" style="--icon:url('icons/line-tool.svg')" aria-hidden="true"></span></button>
        <button data-tool="pen" data-i18n-title="capture.toolbar.pen" data-i18n-aria-label="capture.toolbar.pen"><span class="toolbar-icon" style="--icon:url('icons/pen.svg')" aria-hidden="true"></span></button>
        <button data-tool="highlight" data-i18n-title="capture.toolbar.highlight" data-i18n-aria-label="capture.toolbar.highlight"><span class="toolbar-icon" style="--icon:url('icons/highlight.svg')" aria-hidden="true"></span></button>
        <button data-tool="blur" data-i18n-title="capture.toolbar.blur" data-i18n-aria-label="capture.toolbar.blur"><span class="toolbar-icon" style="--icon:url('icons/mosaic.svg')" aria-hidden="true"></span></button>
        <button data-tool="text" data-i18n-title="capture.toolbar.text" data-i18n-aria-label="capture.toolbar.text"><span class="toolbar-icon" style="--icon:url('icons/text.svg')" aria-hidden="true"></span></button>
        <button data-tool="serial" data-i18n-title="capture.toolbar.serial" data-i18n-aria-label="capture.toolbar.serial"><span class="toolbar-icon" style="--icon:url('icons/serial.svg')" aria-hidden="true"></span></button>
        <button data-tool="watermark" data-i18n-title="capture.toolbar.watermark" data-i18n-aria-label="capture.toolbar.watermark"><span class="toolbar-icon" style="--icon:url('icons/watermark.svg')" aria-hidden="true"></span></button>
      </div>
      <div class="divider"></div>
      <div class="color-wrap">
        <button id="colorButton" type="button" aria-haspopup="true" aria-expanded="false" data-i18n-title="capture.toolbar.color" data-i18n-aria-label="capture.toolbar.color"><span id="colorSwatch"></span></button>
        <div id="colorPalette" class="color-palette hidden" role="group" data-i18n-aria-label="capture.palette.group">
          <div class="color-options">
            <button type="button" class="color-swatch" data-annotation-color="#ff3b30" aria-pressed="false" style="--swatch:#ff3b30" data-i18n-title="capture.palette.red" data-i18n-aria-label="capture.palette.red"></button>
            <button type="button" class="color-swatch" data-annotation-color="#ff9500" aria-pressed="false" style="--swatch:#ff9500" data-i18n-title="capture.palette.orange" data-i18n-aria-label="capture.palette.orange"></button>
            <button type="button" class="color-swatch" data-annotation-color="#ffcc00" aria-pressed="false" style="--swatch:#ffcc00" data-i18n-title="capture.palette.yellow" data-i18n-aria-label="capture.palette.yellow"></button>
            <button type="button" class="color-swatch" data-annotation-color="#34c759" aria-pressed="false" style="--swatch:#34c759" data-i18n-title="capture.palette.green" data-i18n-aria-label="capture.palette.green"></button>
            <button type="button" class="color-swatch" data-annotation-color="#1687ff" aria-pressed="false" style="--swatch:#1687ff" data-i18n-title="capture.palette.blue" data-i18n-aria-label="capture.palette.blue"></button>
            <button type="button" class="color-swatch" data-annotation-color="#111111" aria-pressed="false" style="--swatch:#111111" data-i18n-title="capture.palette.black" data-i18n-aria-label="capture.palette.black"></button>
            <button type="button" class="color-swatch" data-annotation-color="#ffffff" aria-pressed="false" style="--swatch:#ffffff" data-i18n-title="capture.palette.white" data-i18n-aria-label="capture.palette.white"></button>
          </div>
          <label class="color-custom" data-i18n-title="capture.palette.custom"><input id="color" type="color" value="#ff3b30"><span data-i18n="capture.palette.custom"></span></label>
          <div id="recentColors" class="color-recent hidden" data-i18n-aria-label="capture.palette.recent"></div>
        </div>
      </div>
      <div id="widthGroup" class="width-group" role="group" data-i18n-aria-label="capture.toolbar.width-group">
        <button type="button" data-annotation-width="2" data-i18n-title="capture.toolbar.width-thin-tip" aria-pressed="false" data-i18n="capture.toolbar.width-thin"></button>
        <button type="button" data-annotation-width="4" class="active" data-i18n-title="capture.toolbar.width-medium-tip" aria-pressed="true" data-i18n="capture.toolbar.width-medium"></button>
        <button type="button" data-annotation-width="8" data-i18n-title="capture.toolbar.width-thick-tip" aria-pressed="false" data-i18n="capture.toolbar.width-thick"></button>
      </div>
      <div class="divider"></div>
      <button id="undo" data-i18n-title="capture.toolbar.undo-tip" data-i18n-aria-label="capture.toolbar.undo"><span class="toolbar-icon" style="--icon:url('icons/undo.svg')" aria-hidden="true"></span></button>
      <button id="redo" data-i18n-title="capture.toolbar.redo-tip" data-i18n-aria-label="capture.toolbar.redo"><span class="toolbar-icon" style="--icon:url('icons/redo.svg')" aria-hidden="true"></span></button>
      <div class="divider"></div>
      <button id="longCapture" data-i18n-title="capture.toolbar.long-capture" data-i18n-aria-label="capture.toolbar.long-capture"><span class="toolbar-icon" style="--icon:url('icons/long-capture.svg')" aria-hidden="true"></span></button>
      <button id="qr" data-i18n-title="capture.toolbar.qr" data-i18n-aria-label="capture.toolbar.qr"><span class="toolbar-icon" style="--icon:url('icons/qr.svg')" aria-hidden="true"></span></button>
      <button id="table" data-i18n-title="capture.toolbar.table" data-i18n-aria-label="capture.toolbar.table"><span class="toolbar-icon" style="--icon:url('icons/table.svg')" aria-hidden="true"></span></button>
      <button id="ocr" data-i18n-title="capture.toolbar.ocr" data-i18n-aria-label="capture.toolbar.ocr"><span class="toolbar-icon" style="--icon:url('icons/ocr.svg')" aria-hidden="true"></span></button>
      <button id="translate" data-i18n-title="capture.toolbar.translate" data-i18n-aria-label="capture.toolbar.translate"><span class="toolbar-icon" style="--icon:url('icons/translate.svg')" aria-hidden="true"></span></button>
      <button id="record" data-i18n-title="capture.toolbar.record" data-i18n-aria-label="capture.toolbar.record"><span class="toolbar-icon" style="--icon:url('icons/record.svg')" aria-hidden="true"></span></button>
      <button id="pin" data-i18n-title="capture.toolbar.pin" data-i18n-aria-label="capture.toolbar.pin"><span class="toolbar-icon" style="--icon:url('icons/pin.svg')" aria-hidden="true"></span></button>
      <button id="save" data-i18n-title="capture.toolbar.save-tip" data-i18n-aria-label="capture.toolbar.save"><span class="toolbar-icon" style="--icon:url('icons/save.svg')" aria-hidden="true"></span></button>
      <button id="exportPdf" data-i18n-title="capture.toolbar.export-pdf" data-i18n-aria-label="capture.toolbar.export-pdf"><span class="toolbar-icon" style="--icon:url('icons/print.svg')" aria-hidden="true"></span></button>
      <button id="copy" class="primary" data-i18n-title="capture.toolbar.copy-tip" data-i18n-aria-label="capture.toolbar.copy"><span class="toolbar-icon" style="--icon:url('icons/copy.svg')" aria-hidden="true"></span></button>
      <button id="close" data-i18n-title="capture.toolbar.close-tip" data-i18n-aria-label="capture.toolbar.close"><span class="toolbar-icon" style="--icon:url('icons/close.svg')" aria-hidden="true"></span></button>
    </div>
    <div id="toolOptions" class="toolbar-row hidden">
      <!-- B2/B3/B5 (D5/D9): one group per option role; data-option-tools is the
           declarative owner list, so the row is a projection of the active tool. -->
      <div class="option-group" data-option-group="fill" data-option-tools="rect ellipse" role="group" data-i18n-aria-label="capture.options.fill-group">
        <button type="button" data-annotation-option="fill" data-annotation-option-value="none" aria-pressed="true" data-i18n-title="capture.options.fill-none" data-i18n="capture.options.fill-none"></button>
        <button type="button" data-annotation-option="fill" data-annotation-option-value="translucent" aria-pressed="false" data-i18n-title="capture.options.fill-translucent" data-i18n="capture.options.fill-translucent"></button>
        <button type="button" data-annotation-option="fill" data-annotation-option-value="solid" aria-pressed="false" data-i18n-title="capture.options.fill-solid" data-i18n="capture.options.fill-solid"></button>
      </div>
      <div class="option-group" data-option-group="dash" data-option-tools="rect ellipse line arrow" role="group" data-i18n-aria-label="capture.options.dash-group">
        <button type="button" data-annotation-option="dash" data-annotation-option-value="solid" aria-pressed="true" data-i18n-title="capture.options.dash-solid" data-i18n="capture.options.dash-solid"></button>
        <button type="button" data-annotation-option="dash" data-annotation-option-value="dashed" aria-pressed="false" data-i18n-title="capture.options.dash-dashed" data-i18n="capture.options.dash-dashed"></button>
        <button type="button" data-annotation-option="dash" data-annotation-option-value="dotted" aria-pressed="false" data-i18n-title="capture.options.dash-dotted" data-i18n="capture.options.dash-dotted"></button>
      </div>
      <div class="option-group" data-option-group="radius" data-option-tools="rect" role="group" data-i18n-aria-label="capture.options.radius-group">
        <button type="button" data-annotation-option="radius" data-annotation-option-value="0" aria-pressed="true" data-i18n-title="capture.options.radius-none" data-i18n="capture.options.radius-none"></button>
        <button type="button" data-annotation-option="radius" data-annotation-option-value="4" aria-pressed="false" data-i18n-title="capture.options.radius-small" data-i18n="capture.options.radius-small"></button>
        <button type="button" data-annotation-option="radius" data-annotation-option-value="8" aria-pressed="false" data-i18n-title="capture.options.radius-large" data-i18n="capture.options.radius-large"></button>
      </div>
      <div class="option-group" data-option-group="heads" data-option-tools="arrow" role="group" data-i18n-aria-label="capture.options.head-group">
        <button type="button" data-annotation-option="startHead" data-annotation-option-value="true" aria-pressed="false" data-i18n-title="capture.options.head-start" data-i18n="capture.options.head-start"></button>
        <button type="button" data-annotation-option="endHead" data-annotation-option-value="true" aria-pressed="true" data-i18n-title="capture.options.head-end" data-i18n="capture.options.head-end"></button>
      </div>
      <div class="option-group" data-option-group="alpha" data-option-tools="highlight" role="group" data-i18n-aria-label="capture.options.alpha-group">
        <button type="button" data-annotation-option="alpha" data-annotation-option-value="light" aria-pressed="false" data-i18n-title="capture.options.alpha-light" data-i18n="capture.options.alpha-light"></button>
        <button type="button" data-annotation-option="alpha" data-annotation-option-value="medium" aria-pressed="true" data-i18n-title="capture.options.alpha-medium" data-i18n="capture.options.alpha-medium"></button>
        <button type="button" data-annotation-option="alpha" data-annotation-option-value="strong" aria-pressed="false" data-i18n-title="capture.options.alpha-strong" data-i18n="capture.options.alpha-strong"></button>
      </div>
      <div class="option-group" data-option-group="bold" data-option-tools="text" role="group" data-i18n-aria-label="capture.options.bold-group">
        <button type="button" data-annotation-option="bold" data-annotation-option-value="true" aria-pressed="false" data-i18n-title="capture.options.bold" data-i18n="capture.options.bold"></button>
      </div>
    </div>
  </div>
  <div id="elementBar" class="element-bar hidden">
    <span data-i18n="capture.element.selected"></span>
    <span id="elementCount" class="element-count hidden"></span>
    <span class="element-hint" data-i18n-title="capture.element.move-hint-tip" data-i18n="capture.element.move-hint"></span>
    <span class="element-hint" data-i18n-title="capture.element.resize-hint-tip" data-i18n="capture.element.resize-hint"></span>
    <button id="elementDelete" class="danger" data-i18n-title="capture.element.delete-tip" data-i18n-aria-label="capture.element.delete-aria" data-i18n="common.button.delete"></button>
    <button id="elementFront" data-i18n-title="capture.element.front-tip" data-i18n-aria-label="capture.element.front-aria" data-i18n="capture.element.front"></button>
    <button id="elementBack" data-i18n-title="capture.element.back-tip" data-i18n-aria-label="capture.element.back-aria" data-i18n="capture.element.back"></button>
    <button id="elementDeselect" data-i18n-title="capture.element.deselect-tip" data-i18n-aria-label="capture.element.deselect" data-i18n="capture.element.deselect"></button>
  </div>
  <div id="watermarkPanel" class="watermark-panel hidden">
    <div class="watermark-row"><label for="watermarkContent" data-i18n="capture.watermark.content"></label><input id="watermarkContent" type="text" data-i18n-placeholder="capture.watermark.content-placeholder" maxlength="200"></div>
    <div class="watermark-row watermark-check-row">
      <label for="watermarkDateSuffix" data-i18n="capture.watermark.date"></label>
      <label class="watermark-checkbox" data-i18n-title="capture.watermark.date-tip">
        <input id="watermarkDateSuffix" type="checkbox">
        <span data-i18n="capture.watermark.date-suffix"></span>
      </label>
    </div>
    <div class="watermark-row"><label for="watermarkOpacity" data-i18n="capture.watermark.opacity"></label><input id="watermarkOpacity" type="range" min="5" max="100" step="5" value="80"><span id="watermarkOpacityValue">80%</span></div>
    <div class="watermark-row"><label for="watermarkColor" data-i18n="capture.watermark.color"></label><input id="watermarkColor" type="color" value="#ffffff"></div>
    <div class="watermark-row"><label for="watermarkSpacing" data-i18n="capture.watermark.spacing"></label><input id="watermarkSpacing" type="range" min="5" max="100" step="5" value="30"><span id="watermarkSpacingValue">30%</span></div>
    <div class="watermark-row"><label for="watermarkFontSize" data-i18n="capture.watermark.font-size"></label><input id="watermarkFontSize" type="number" min="8" max="200" step="1" value="24"><span>px</span></div>
    <div class="watermark-row"><label for="watermarkRotation" data-i18n="capture.watermark.rotation"></label><input id="watermarkRotation" type="number" min="-180" max="180" step="1" value="30"><span>°</span></div>
    <div class="watermark-actions"><button id="watermarkCancel" data-i18n="common.button.cancel"></button><button id="watermarkApply" class="primary" data-i18n="capture.watermark.apply"></button></div>
  </div>
  <div id="resultPanel" class="result-panel hidden">
    <div class="result-head"><strong id="resultTitle" data-i18n="capture.result.title"></strong><button id="resultClose">×</button></div>
    <div id="resultSource" class="result-source hidden"></div>
    <textarea id="resultText" readonly></textarea>
    <div class="result-actions"><button id="resultCopy" data-i18n="capture.result.copy"></button><button id="resultDone" class="primary" data-i18n="capture.result.done"></button></div>
  </div>
  <div id="ocrResultBar" class="ocr-result-bar hidden">
    <span id="ocrSummary" data-i18n="capture.ocr.summary"></span>
    <button id="ocrToggleSource" class="hidden" data-i18n="capture.ocr.show-source"></button>
    <button id="ocrPlainText" data-i18n="capture.ocr.plain-text"></button>
    <button id="ocrCopyAll" class="primary" data-i18n="capture.ocr.copy-all"></button>
    <button id="ocrResultClose" data-i18n-title="capture.ocr.close-tip">×</button>
  </div>
  <div id="loading" class="loading hidden"><span></span><b data-i18n="capture.loading.text"></b></div>
  <audio id="shutterSound" src="../assets/shutter.wav" preload="auto"></audio>
  <!-- P0-1-T4（S11）：i18n runtime + locale tables. They must load before capture.js: the
       controller calls restoreStoredLanguage()/applyTranslations() on load and builds every
       dynamic string with t(). The three per-language files carry the cross-window keys,
       ../shared/locales/capture.js carries the `capture.*` keys. -->
  <script src="../shared/i18n.js"></script>
  <script src="../shared/locales/zh-CN.js"></script>
  <script src="../shared/locales/en-US.js"></script>
  <script src="../shared/locales/zh-TW.js"></script>
  <script src="../shared/locales/capture.js"></script>
  <script src="annotation-style.js"></script>
  <script src="selection-utils.js"></script>
  <script src="annotation-geometry.js"></script>
  <!-- P0-2（S9b）：光标落点的纯几何函数，与主进程 main/services/cursor-provider.js 共用同一份
       契约（UMD）。必须在 capture.js 之前加载，capture.js 里以 window.cursorGeometry 同步取用。 -->
  <script src="../shared/cursor-geometry.js"></script>
  <script src="capture.js"></script>
</body>
</html>
