<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src highlighter-clipboard:; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<title>Highlighter</title>
<!-- FILM language (B1, 2026 re-theme): the palette comes from shared/tokens.css. This page
     must link the tokens before its own stylesheet so no window-local colour
     ever shadows the shared ladder. -->
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="clipboard.css"></head>
<body>
  <div class="panel">
    <header class="topbar">
      <div class="topbar-copy">
        <h1 data-i18n="clipboard.title">Clipboard history</h1>
        <span class="badge" data-i18n="clipboard.badge.local">Local</span>
      </div>
      <button id="pause" class="quiet-button" type="button"></button>
      <button id="close" class="icon-button" type="button" data-i18n-title="clipboard.close" data-i18n-aria-label="clipboard.close">×</button>
    </header>
    <div class="status-rail">
      <span class="led" id="led" aria-hidden="true"></span>
      <span id="status" role="status" aria-live="polite"></span>
      <button id="refresh" class="quiet-button" type="button" data-i18n="clipboard.refresh">Refresh</button>
    </div>
    <div class="search-row">
      <span class="search-glyph" aria-hidden="true"></span>
      <input id="search" type="search" maxlength="400" autocomplete="off" spellcheck="false" data-i18n-placeholder="clipboard.search" data-i18n-aria-label="clipboard.search">
    </div>
    <nav id="kinds" class="chips" data-i18n-aria-label="clipboard.kind">
      <button class="chip" type="button" data-kind="" data-i18n="clipboard.all" aria-pressed="true">All</button>
      <button class="chip" type="button" data-kind="text" data-i18n="clipboard.text" aria-pressed="false">Text</button>
      <button class="chip" type="button" data-kind="url" data-i18n="clipboard.url" aria-pressed="false">Links</button>
      <button class="chip" type="button" data-kind="image" data-i18n="clipboard.image" aria-pressed="false">Images</button>
      <button class="chip" type="button" data-kind="files" data-i18n="clipboard.files" aria-pressed="false">Files</button>
      <span class="chips-spacer" aria-hidden="true"></span>
      <button id="pinned" class="chip" type="button" data-i18n="clipboard.pinned" aria-pressed="false">Pinned</button>
    </nav>
    <button id="new" class="banner" type="button" hidden data-i18n="clipboard.new">New records — refresh</button>
    <div class="list-wrap">
      <main id="list" tabindex="0" role="listbox" data-i18n-aria-label="clipboard.title">
        <div id="rows" role="presentation"></div>
        <div id="empty" class="empty" hidden><span class="empty-mark" aria-hidden="true"></span><p data-i18n="clipboard.empty">No matching records</p></div>
      </main>
      <section id="detail" class="detail" hidden role="region" data-i18n-aria-label="clipboard.title">
        <div class="detail-head">
          <span id="detailBadge" class="kind-badge" aria-hidden="true"></span>
          <span id="detailMeta" class="detail-meta"></span>
        </div>
        <div class="detail-body">
          <pre id="text"></pre>
          <div id="media" class="detail-media" hidden><img id="image" alt=""></div>
          <small id="truncated" class="truncated" hidden data-i18n="clipboard.truncated">Showing the first 64 KiB. Copy preserves the complete original.</small>
        </div>
      </section>
    </div>
    <button id="more" class="more-button" type="button" hidden data-i18n="clipboard.more">Load next page</button>
    <footer class="footer">
      <button id="copy" class="button primary" type="button" data-i18n="clipboard.copy" title="Enter">Copy</button>
      <button id="paste" class="button" type="button" data-i18n="clipboard.paste" title="Ctrl+Enter">Paste</button>
      <button id="view" class="button" type="button" data-i18n="clipboard.view-text" aria-expanded="false" aria-controls="detail" hidden>Show full text</button>
      <span class="footer-spacer" aria-hidden="true"></span>
      <button id="pin" class="button" type="button"></button>
      <button id="delete" class="button danger" type="button" data-i18n="clipboard.delete" title="Delete">Delete</button>
      <button id="clear" class="quiet-button" type="button" data-i18n="clipboard.clear-ordinary">Clear unpinned</button>
    </footer>
    <div id="feedback" role="status" aria-live="polite" hidden>
      <span class="feedback-brand" aria-hidden="true"><b>High</b>lighter</span>
      <span class="led" aria-hidden="true"></span>
      <p id="feedbackText"></p>
      <span class="feedback-eyebrow" data-i18n="clipboard.result.eyebrow">Paste result</span>
    </div>
  </div>
  <script src="../shared/locales/zh-CN.js"></script><script src="../shared/locales/en-US.js"></script><script src="../shared/locales/zh-TW.js"></script><script src="../shared/locales/clipboard.js"></script><script src="../shared/i18n.js"></script><script src="clipboard-layout.js"></script><script src="clipboard.js"></script>
</body></html>
