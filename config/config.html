<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Highlighter</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="config.css">
</head>
<body>
  <div class="window-shell">
    <aside class="sidebar">
      <div class="brand"><span>High</span>lighter</div>
      <nav>
        <button class="nav-item active" data-route="home"><i class="svg-icon nav-icon" style="--icon:url('icons/lightning.svg')" aria-hidden="true"></i><span>快捷功能</span></button>
        <div class="nav-group"><b>工具箱</b></div>
        <button class="nav-item" data-route="translation"><i class="svg-icon nav-icon" style="--icon:url('../capture/icons/translate.svg')" aria-hidden="true"></i><span>翻译</span></button>
        <button class="nav-item" data-route="chat"><i class="svg-icon nav-icon" style="--icon:url('icons/robot.svg')" aria-hidden="true"></i><span>AI 对话</span></button>
        <button class="nav-item" data-route="history"><i class="svg-icon nav-icon" style="--icon:url('icons/history.svg')" aria-hidden="true"></i><span>截图历史</span></button>
        <button class="nav-item" data-route="local-search"><i class="svg-icon nav-icon" style="--icon:url('icons/search.svg')" aria-hidden="true"></i><span>本地搜索</span></button>
        <div class="nav-group"><b>个性化</b></div>
        <button class="nav-item" data-route="appearance"><i class="svg-icon nav-icon" style="--icon:url('icons/palette.svg')" aria-hidden="true"></i><span>外观配色</span></button>
        <button class="nav-item" data-route="plugins"><i class="svg-icon nav-icon" style="--icon:url('icons/components.svg')" aria-hidden="true"></i><span>插件</span></button>
        <div class="nav-group"><b>设置</b></div>
        <button class="nav-item" data-route="settings-general"><i class="svg-icon nav-icon" style="--icon:url('icons/layout.svg')" aria-hidden="true"></i><span>界面设置</span></button>
        <button class="nav-item" data-route="models"><i class="svg-icon nav-icon" style="--icon:url('icons/model.svg')" aria-hidden="true"></i><span>模型</span></button>
        <button class="nav-item" data-route="settings-function"><i class="svg-icon nav-icon" style="--icon:url('icons/settings.svg')" aria-hidden="true"></i><span>功能设置</span></button>
        <button class="nav-item" data-route="selection-toolbar"><i class="svg-icon nav-icon" style="--icon:url('icons/text-style.svg')" aria-hidden="true"></i><span>划词工具</span></button>
        <button class="nav-item" data-route="settings-hotkeys"><i class="svg-icon nav-icon" style="--icon:url('icons/keyboard.svg')" aria-hidden="true"></i><span>热键设置</span></button>
        <button class="nav-item" data-route="settings-system"><i class="svg-icon nav-icon" style="--icon:url('icons/system.svg')" aria-hidden="true"></i><span>系统设置</span></button>
        <button class="nav-item about-item" data-route="about"><i class="svg-icon nav-icon" style="--icon:url('icons/info.svg')" aria-hidden="true"></i><span>关于</span></button>
      </nav>
    </aside>
    <section class="workspace">
      <header class="titlebar">
        <div id="pageTitle">快捷功能</div>
        <div class="window-actions"><button id="minimize" title="最小化" aria-label="最小化"><span class="svg-icon" style="--icon:url('../capture/icons/line.svg')" aria-hidden="true"></span></button><button id="close" title="关闭" aria-label="关闭"><span class="svg-icon" style="--icon:url('../capture/icons/close.svg')" aria-hidden="true"></span></button></div>
      </header>
      <!-- Status rail: surfaces what the app is currently capable of doing
           (OCR engine, active model, hotkey coverage, local search index)
           instead of hiding it behind separate settings pages. Populated by
           refreshStatusRail() and shown only on routes where it is relevant. -->
      <div class="status-rail" id="statusRail" hidden></div>
      <main id="view"></main>
    </section>
  </div>
  <div id="toast" class="toast"></div>
  <script src="../search/search-utils.js"></script>
  <script src="../toolbar/toolbar-action-meta.js"></script>
  <script src="../shared/coding-plan-presets.js"></script>
  <script src="../shared/shortcut-keys.js"></script>
  <!-- D2-2（S14）：设置页按路由拆分。顺序 = 共享 helper -> 纯 helper -> 各路由 -> 主壳。 -->
  <!-- 经典脚本共享全局作用域，主壳因此能直接调用路由文件里的顶层 function/const。 -->
  <!-- window.configRoutes 由 routes/shared.js 在载入时创建（CSP 禁止内联脚本）； -->
  <!-- shared.js 先于其余路由文件执行，所以各路由文件顶层那行登记一定有容器可写。 -->
  <script src="routes/shared.js"></script>
  <script src="routes/model-helpers.js"></script>
  <script src="routes/home.js"></script>
  <script src="routes/translation.js"></script>
  <script src="routes/chat.js"></script>
  <script src="routes/history.js"></script>
  <script src="routes/selection-toolbar-editor.js"></script>
  <script src="routes/selection-toolbar.js"></script>
  <script src="routes/models-editor.js"></script>
  <script src="routes/models-provider.js"></script>
  <script src="routes/models-feature.js"></script>
  <script src="routes/models-render.js"></script>
  <script src="routes/models-plan.js"></script>
  <script src="routes/appearance.js"></script>
  <script src="routes/plugins.js"></script>
  <script src="routes/local-search.js"></script>
  <script src="routes/settings.js"></script>
  <script src="routes/about.js"></script>
  <script src="config.js"></script>
</body>
</html>
