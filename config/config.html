<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Highlighter</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="config.css">
</head>
<body>
  <div class="window-shell">
    <aside class="sidebar">
      <div class="brand"><span>High</span>lighter</div>
      <nav>
        <button class="nav-item active" data-route="home"><i class="svg-icon nav-icon" style="--icon:url('icons/lightning.svg')" aria-hidden="true"></i><span data-i18n="config.route.home"></span></button>
        <div class="nav-group"><b data-i18n="config.nav.toolbox"></b></div>
        <button class="nav-item" data-route="translation"><i class="svg-icon nav-icon" style="--icon:url('../capture/icons/translate.svg')" aria-hidden="true"></i><span data-i18n="config.route.translation"></span></button>
        <button class="nav-item" data-route="chat"><i class="svg-icon nav-icon" style="--icon:url('icons/robot.svg')" aria-hidden="true"></i><span data-i18n="config.route.chat"></span></button>
        <button class="nav-item" data-route="history"><i class="svg-icon nav-icon" style="--icon:url('icons/history.svg')" aria-hidden="true"></i><span data-i18n="config.route.history"></span></button>
        <button class="nav-item" data-route="local-search"><i class="svg-icon nav-icon" style="--icon:url('icons/search.svg')" aria-hidden="true"></i><span data-i18n="config.route.local-search"></span></button>
        <div class="nav-group"><b data-i18n="config.nav.personalize"></b></div>
        <button class="nav-item" data-route="appearance"><i class="svg-icon nav-icon" style="--icon:url('icons/palette.svg')" aria-hidden="true"></i><span data-i18n="config.route.appearance"></span></button>
        <button class="nav-item" data-route="plugins"><i class="svg-icon nav-icon" style="--icon:url('icons/components.svg')" aria-hidden="true"></i><span data-i18n="config.route.plugins"></span></button>
        <div class="nav-group"><b data-i18n="config.nav.settings"></b></div>
        <button class="nav-item" data-route="settings-general"><i class="svg-icon nav-icon" style="--icon:url('icons/layout.svg')" aria-hidden="true"></i><span data-i18n="config.route.settings-general"></span></button>
        <button class="nav-item" data-route="models"><i class="svg-icon nav-icon" style="--icon:url('icons/model.svg')" aria-hidden="true"></i><span data-i18n="config.route.models"></span></button>
        <button class="nav-item" data-route="settings-function"><i class="svg-icon nav-icon" style="--icon:url('icons/settings.svg')" aria-hidden="true"></i><span data-i18n="config.route.settings-function"></span></button>
        <button class="nav-item" data-route="selection-toolbar"><i class="svg-icon nav-icon" style="--icon:url('icons/text-style.svg')" aria-hidden="true"></i><span data-i18n="config.route.selection-toolbar"></span></button>
        <button class="nav-item" data-route="settings-hotkeys"><i class="svg-icon nav-icon" style="--icon:url('icons/keyboard.svg')" aria-hidden="true"></i><span data-i18n="config.route.settings-hotkeys"></span></button>
        <button class="nav-item" data-route="settings-system"><i class="svg-icon nav-icon" style="--icon:url('icons/system.svg')" aria-hidden="true"></i><span data-i18n="config.route.settings-system"></span></button>
        <button class="nav-item about-item" data-route="about"><i class="svg-icon nav-icon" style="--icon:url('icons/info.svg')" aria-hidden="true"></i><span data-i18n="config.route.about"></span></button>
      </nav>
    </aside>
    <section class="workspace">
      <header class="titlebar">
        <div id="pageTitle" data-i18n="config.route.home"></div>
        <div class="window-actions"><button id="minimize" data-i18n-title="config.titlebar.minimize" data-i18n-aria-label="config.titlebar.minimize"><span class="svg-icon" style="--icon:url('../capture/icons/line.svg')" aria-hidden="true"></span></button><button id="close" data-i18n-title="config.titlebar.close" data-i18n-aria-label="config.titlebar.close"><span class="svg-icon" style="--icon:url('../capture/icons/close.svg')" aria-hidden="true"></span></button></div>
      </header>
      <!-- Status rail: surfaces what the app is currently capable of doing
           (OCR engine, active model, hotkey coverage, local search index)
           instead of hiding it behind separate settings pages. Populated by
           refreshStatusRail() and shown only on routes where it is relevant. -->
      <div class="status-rail" id="statusRail" hidden></div>
      <main id="view"></main>
    </section>
  </div>
  <div id="toast" class="toast"></div>
  <!-- P0-1-T3 (S1, batch C): the locale tables register plain globals and have to
       arrive as plain script tags — every window CSP is `default-src 'none'` with
       `connect-src 'none'`, so nothing can be fetched. The domain file
       (shared/locales/config.js) carries this window's keys for all three
       languages; shared/i18n.js then exposes t()/applyTranslations() and must load
       before any script that resolves a key. -->
  <script src="../shared/locales/zh-CN.js"></script>
  <script src="../shared/locales/en-US.js"></script>
  <script src="../shared/locales/zh-TW.js"></script>
  <script src="../shared/locales/config.js"></script>
  <!-- `toolbar-action-meta.js` below carries `toolbar.action.*` as i18n keys and
       the selection-toolbar settings route resolves them with t(), so this window
       needs the toolbar domain table too — without it those rows render the raw
       key names. -->
  <script src="../shared/locales/toolbar.js"></script>
  <!-- Same reason: `search-utils.js` below hands this window `search.category.*`
       and `search.sort.*` key literals for the local-search route's category
       editor and sort select, and those keys live in the search domain table. -->
  <script src="../shared/locales/search.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../search/search-utils.js"></script>
  <script src="../toolbar/toolbar-action-meta.js"></script>
  <script src="../shared/coding-plan-presets.js"></script>
  <script src="../shared/shortcut-keys.js"></script>
  <!-- D2-2 (S14): the settings window is split per route. Order = shared helpers ->
       pure helpers -> every route -> shell. Classic scripts share one global scope,
       so the shell can call the top-level function/const of a route file directly.
       window.configRoutes is created by routes/shared.js while it loads (CSP forbids
       inline scripts); shared.js runs before the other route files, so the
       registration line at their top level always has a container to write to. -->
  <script src="routes/shared.js"></script>
  <script src="routes/model-helpers.js"></script>
  <script src="routes/home.js"></script>
  <script src="routes/translation.js"></script>
  <script src="routes/chat.js"></script>
  <script src="routes/history.js"></script>
  <script src="routes/selection-toolbar-editor.js"></script>
  <script src="routes/selection-toolbar.js"></script>
  <script src="routes/models-editor.js"></script>
  <script src="routes/models-provider.js"></script>
  <script src="routes/models-feature.js"></script>
  <script src="routes/models-render.js"></script>
  <script src="routes/models-plan.js"></script>
  <script src="routes/appearance.js"></script>
  <script src="routes/plugins.js"></script>
  <script src="routes/local-search.js"></script>
  <script src="routes/settings.js"></script>
  <script src="routes/about.js"></script>
  <script src="config.js"></script>
</body>
</html>
