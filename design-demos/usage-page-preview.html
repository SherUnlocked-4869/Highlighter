<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' file: data: blob:; font-src 'self' file: data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Highlighter — usage page preview (dev)</title>
  <!--
    DEV-ONLY visual-review harness for the AI usage page. Not shipped:
    design-demos/ is not part of electron-builder build.files.
    It loads the real shared/tokens.css, config/config.css and the real
    config/routes/usage.js inside a static copy of the settings-window shell,
    and fakes window.electronAPI with dense deterministic payloads so the page
    can be screenshotted without a visible window (scripts/usage-visual-preview.js).
    See design-demos/usage-page-preview/README.md and the --from-git baseline
    mode of the harness.
  -->
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../config/config.css">
  <style>
    /* Capture mode: let the document grow to its full content height so the
       hidden window can be resized to it and capturePage() grabs the whole
       page. The app itself scrolls inside #view; horizontal metrics are
       untouched. */
    html, body { height: auto; min-height: 100%; overflow: visible; }
    .window-shell { height: auto; min-height: 100vh; }
    .workspace { min-height: 100vh; }
    #view { overflow: visible; flex: 0 0 auto; }
    .sidebar { min-height: 100vh; }
    /* Deterministic rendering for screenshots. */
    * { transition: none !important; animation: none !important; caret-color: transparent !important; }
  </style>
</head>
<body>
  <div class="window-shell">
    <aside class="sidebar">
      <div class="brand"><span>High</span>lighter</div>
      <nav>
        <button class="nav-item" data-route="home"><i class="svg-icon nav-icon" style="--icon:url('../config/icons/lightning.svg')" aria-hidden="true"></i><span data-i18n="config.route.home"></span></button>
        <div class="nav-group"><b data-i18n="config.nav.toolbox"></b></div>
        <button class="nav-item" data-route="translation"><i class="svg-icon nav-icon" style="--icon:url('../capture/icons/translate.svg')" aria-hidden="true"></i><span data-i18n="config.route.translation"></span></button>
        <button class="nav-item" data-route="chat"><i class="svg-icon nav-icon" style="--icon:url('../config/icons/robot.svg')" aria-hidden="true"></i><span data-i18n="config.route.chat"></span></button>
        <button class="nav-item" data-route="history"><i class="svg-icon nav-icon" style="--icon:url('../config/icons/history.svg')" aria-hidden="true"></i><span data-i18n="config.route.history"></span></button>
        <div class="nav-group"><b data-i18n="config.nav.tool-settings"></b></div>
        <button class="nav-item" data-route="selection-toolbar"><i class="svg-icon nav-icon" style="--icon:url('../config/icons/text-style.svg')" aria-hidden="true"></i><span data-i18n="config.route.selection-toolbar"></span></button>
        <button class="nav-item" data-route="local-search"><i class="svg-icon nav-icon" style="--icon:url('../config/icons/search.svg')" aria-hidden="true"></i><span data-i18n="config.route.local-search"></span></button>
        <button class="nav-item" data-route="clipboard-history"><i class="svg-icon nav-icon" style="--icon:url('../config/icons/history.svg')" aria-hidden="true"></i><span data-i18n="clipboard.title"></span></button>
        <button class="nav-item active" data-route="usage"><i class="svg-icon nav-icon" style="--icon:url('../config/icons/usage.svg')" aria-hidden="true"></i><span data-i18n="config.route.usage"></span></button>
        <div class="nav-group"><b data-i18n="config.nav.settings"></b></div>
        <button class="nav-item" data-route="settings-general"><i class="svg-icon nav-icon" style="--icon:url('../config/icons/layout.svg')" aria-hidden="true"></i><span data-i18n="config.route.settings-general"></span></button>
        <button class="nav-item" data-route="settings-function"><i class="svg-icon nav-icon" style="--icon:url('../config/icons/settings.svg')" aria-hidden="true"></i><span data-i18n="config.route.settings-function"></span></button>
        <button class="nav-item" data-route="models"><i class="svg-icon nav-icon" style="--icon:url('../config/icons/model.svg')" aria-hidden="true"></i><span data-i18n="config.route.models"></span></button>
        <button class="nav-item" data-route="settings-system"><i class="svg-icon nav-icon" style="--icon:url('../config/icons/system.svg')" aria-hidden="true"></i><span data-i18n="config.route.settings-system"></span></button>
        <button class="nav-item about-item" data-route="about"><i class="svg-icon nav-icon" style="--icon:url('../config/icons/info.svg')" aria-hidden="true"></i><span data-i18n="config.route.about"></span></button>
      </nav>
    </aside>
    <section class="workspace">
      <header class="titlebar">
        <div id="pageTitle" data-i18n="config.route.usage"></div>
        <div class="window-actions">
          <button id="minimize" type="button" aria-label="minimize"><span class="svg-icon" style="--icon:url('../capture/icons/line.svg')" aria-hidden="true"></span></button>
          <button id="close" type="button" aria-label="close"><span class="svg-icon" style="--icon:url('../capture/icons/close.svg')" aria-hidden="true"></span></button>
        </div>
      </header>
      <div class="status-rail" id="statusRail" hidden></div>
      <main id="view"></main>
    </section>
  </div>
  <div id="toast" class="toast"></div>

  <script>
    // ── Mock data + window.electronAPI (defined BEFORE the real route script) ─
    // Everything here is deterministic for a given run date so before/after
    // screenshots are comparable. Payload shapes follow the frozen usage:* IPC
    // contract (plan §2.7) as consumed by config/routes/usage.js.
    (function () {
      'use strict';
      window.__usagePreviewErrors = [];
      window.addEventListener('error', function (event) {
        window.__usagePreviewErrors.push('pageerror: ' + (event && event.message ? event.message : String(event)));
      });
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        window.__usagePreviewErrors.push('unhandledrejection: ' + (reason && reason.message ? reason.message : String(reason)));
      });

      window.__usagePreviewEmptyHourly = /[?&]emptyHourly=1/.test(location.search);
      var DAY_MS = 24 * 60 * 60 * 1000;
      function pad(value) { return String(value).padStart(2, '0'); }
      function dayKey(date) {
        return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
      }
      function dateOffset(days) {
        var date = new Date();
        date.setHours(12, 0, 0, 0);
        date.setDate(date.getDate() + days);
        return date;
      }
      function isoStartOfDay(offsetDays) {
        var date = dateOffset(offsetDays);
        date.setHours(0, 0, 0, 0);
        return date.toISOString();
      }
      function mulberry32(seed) {
        var state = seed >>> 0;
        return function () {
          state = (state + 0x6d2b79f5) >>> 0;
          var t = state;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      var random = mulberry32(20261021);

      // 60-day daily series (oldest first, newest = today). Two months of dense
      // history plus a few genuine zero days so the trend/table look real.
      var DAILY = (function () {
        var out = [];
        for (var i = 0; i < 60; i += 1) {
          var offset = i - 59;
          var date = dateOffset(offset);
          var weekday = date.getDay();
          var weekend = weekday === 0 || weekday === 6;
          var zero = random() < (weekend ? 0.34 : 0.09);
          var weight = 0.35 + random() * 1.65 + (i / 59) * 0.45;
          out.push({
            day: dayKey(date),
            weight: zero ? 0 : weight,
            conversations: zero ? 0 : Math.max(1, Math.round(weight * (900 + random() * 1500)))
          });
        }
        return out;
      })();

      var TOTAL_BILLABLE = 1090000000;
      var WEIGHT_SUM = DAILY.reduce(function (sum, row) { return sum + row.weight; }, 0) || 1;
      var UNIT = TOTAL_BILLABLE / WEIGHT_SUM;
      DAILY.forEach(function (row) {
        row.billable_total_tokens = Math.round(row.weight * UNIT);
        row.input_tokens = Math.round(row.billable_total_tokens * 0.266);
        row.hidden_cached = Math.round(row.billable_total_tokens * 0.697);
        row.cache_creation_input_tokens = Math.round(row.billable_total_tokens * 0.0165);
        row.output_tokens = Math.round(row.billable_total_tokens * 0.019);
        row.reasoning_output_tokens = Math.round(row.billable_total_tokens * 0.001);
        row.cached_input_tokens = row.hidden_cached;
        row.total_tokens = row.input_tokens + row.output_tokens + row.cached_input_tokens + row.cache_creation_input_tokens + row.reasoning_output_tokens;
        row.conversation_count = row.conversations;
      });

      function sumRows(rows) {
        return rows.reduce(function (totals, row) {
          totals.billable_total_tokens += row.billable_total_tokens;
          totals.input_tokens += row.input_tokens;
          totals.output_tokens += row.output_tokens;
          totals.cached_input_tokens += row.cached_input_tokens;
          totals.cache_creation_input_tokens += row.cache_creation_input_tokens;
          totals.reasoning_output_tokens += row.reasoning_output_tokens;
          totals.total_tokens += row.total_tokens;
          totals.conversation_count += row.conversation_count;
          return totals;
        }, {
          billable_total_tokens: 0,
          input_tokens: 0,
          output_tokens: 0,
          cached_input_tokens: 0,
          cache_creation_input_tokens: 0,
          reasoning_output_tokens: 0,
          total_tokens: 0,
          conversation_count: 0
        });
      }

      function lastN(n) { return DAILY.slice(Math.max(0, DAILY.length - n)); }

      // Round-2 (trend detail modal, integrated card) needs range-aware daily
      // rows so the modal's 30-min / day / month granularities all have data.
      // Days inside the 60-day DAILY window reuse it; older days are synthesised
      // deterministically from the day key so repeat captures are identical.
      var DAY_MS_KEY = 24 * 60 * 60 * 1000;
      function dayKeyToMs(key) {
        var ms = Date.parse(key + 'T00:00:00.000Z');
        return Number.isFinite(ms) ? ms : null;
      }
      function dayKeyFromMs(ms) {
        return new Date(ms).toISOString().slice(0, 10);
      }
      function seededDayRow(key) {
        var found = null;
        for (var i = 0; i < DAILY.length; i += 1) {
          if (DAILY[i].day === key) { found = DAILY[i]; break; }
        }
        if (found) return found;
        var seed = 2166136261;
        for (var c = 0; c < key.length; c += 1) {
          seed ^= key.charCodeAt(c);
          seed = Math.imul(seed, 16777619) >>> 0;
        }
        var rnd = mulberry32(seed);
        var weight = 0.25 + rnd() * 1.8;
        var billable = Math.round(weight * UNIT * (0.55 + rnd() * 0.9));
        var row = {
          day: key,
          weight: weight,
          billable_total_tokens: billable,
          input_tokens: Math.round(billable * 0.266),
          cached_input_tokens: Math.round(billable * 0.697),
          cache_creation_input_tokens: Math.round(billable * 0.0165),
          output_tokens: Math.round(billable * 0.019),
          reasoning_output_tokens: Math.round(billable * 0.001),
          conversation_count: Math.max(1, Math.round(weight * (900 + rnd() * 1500)))
        };
        row.total_tokens = row.input_tokens + row.output_tokens + row.cached_input_tokens + row.cache_creation_input_tokens + row.reasoning_output_tokens;
        return row;
      }
      function rangeRowsFor(fromKey, toKey) {
        var startMs = dayKeyToMs(fromKey);
        var endMs = dayKeyToMs(toKey);
        if (startMs === null || endMs === null || endMs < startMs) return null;
        var days = Math.round((endMs - startMs) / DAY_MS_KEY) + 1;
        if (days > 800) return null;
        var rows = [];
        for (var i = 0; i < days; i += 1) rows.push(seededDayRow(dayKeyFromMs(startMs + i * DAY_MS_KEY)));
        return rows;
      }
      function rangeFromQuery(query) {
        if (!query || typeof query !== 'object') return null;
        var from = typeof query.from === 'string' ? query.from.slice(0, 10) : '';
        var to = typeof query.to === 'string' ? query.to.slice(0, 10) : '';
        if (!from || !to) return null;
        return { from: from, to: to };
      }
      // AI-tool filter (the page sends `sources` only for a real subset). The mock
      // scales every aggregate by the selected sources' share so a filtered page
      // is visibly smaller than the unfiltered one, like the real query does.
      var KNOWN_SOURCES = ['codex', 'dsh', 'opencode'];
      function selectedSources(query) {
        var list = query && Array.isArray(query.sources) ? query.sources : null;
        if (!list) return null;
        var picked = [];
        for (var i = 0; i < list.length; i += 1) {
          if (KNOWN_SOURCES.indexOf(list[i]) !== -1 && picked.indexOf(list[i]) === -1) picked.push(list[i]);
        }
        if (picked.length === 0 || picked.length === KNOWN_SOURCES.length) return null;
        return picked;
      }
      function sourceShareOf(ids) {
        if (!ids) return 1;
        var share = 0;
        for (var i = 0; i < ids.length; i += 1) {
          var spec = SOURCE_SPECS.filter(function (entry) { return entry.source === ids[i]; })[0];
          if (spec) share += spec.share;
        }
        return share;
      }
      function scaleRow(row, ratio) {
        if (!ratio || ratio === 1) return row;
        var copy = {};
        for (var key in row) {
          if (!Object.prototype.hasOwnProperty.call(row, key)) continue;
          copy[key] = typeof row[key] === 'number' && key !== 'weight' ? Math.round(row[key] * ratio) : row[key];
        }
        return copy;
      }
      function scaledRows(rows, ratio) {
        if (!rows || !ratio || ratio === 1) return rows;
        return rows.map(function (row) { return scaleRow(row, ratio); });
      }
      function ratioFor(query) {
        return sourceShareOf(selectedSources(query));
      }

      function summaryForQuery(query) {
        var ratio = ratioFor(query);
        var range = rangeFromQuery(query);
        if (!range) {
          var base = summaryFor((query && query.period) || 'month');
          return ratio === 1 ? base : { ...base, totals: scaleRow(base.totals, ratio), rolling: scaledRolling(base.rolling, ratio) };
        }
        var rows = rangeRowsFor(range.from, range.to);
        if (!rows) {
          var fallback = summaryFor((query && query.period) || 'month');
          return ratio === 1 ? fallback : { ...fallback, totals: scaleRow(fallback.totals, ratio), rolling: scaledRolling(fallback.rolling, ratio) };
        }
        return {
          period: (query && query.period) || 'custom',
          from: range.from,
          to: range.to,
          days: rows.length,
          totals: sumRows(scaledRows(rows, ratio)),
          rolling: scaledRolling(rollingPayload(), ratio)
        };
      }
      function scaledRolling(rolling, ratio) {
        if (!rolling || ratio === 1) return rolling;
        var copy = JSON.parse(JSON.stringify(rolling));
        copy.last7d.billable_total_tokens = Math.round(copy.last7d.billable_total_tokens * ratio);
        copy.last7d.conversation_count = Math.round(copy.last7d.conversation_count * ratio);
        copy.last30d.billable_total_tokens = Math.round(copy.last30d.billable_total_tokens * ratio);
        copy.last30d.conversation_count = Math.round(copy.last30d.conversation_count * ratio);
        copy.avgPerActiveDay = Math.round(copy.avgPerActiveDay * ratio);
        return copy;
      }
      function dailyForQuery(query) {
        var ratio = ratioFor(query);
        var range = rangeFromQuery(query);
        if (!range) {
          var base = dailyFor((query && query.period) || 'month');
          return ratio === 1 ? base : { ...base, rows: scaledRows(base.rows, ratio) };
        }
        var rows = rangeRowsFor(range.from, range.to);
        if (!rows) {
          var fallback = dailyFor((query && query.period) || 'month');
          return ratio === 1 ? fallback : { ...fallback, rows: scaledRows(fallback.rows, ratio) };
        }
        return { period: (query && query.period) || 'custom', from: range.from, to: range.to, rows: scaledRows(rows, ratio) };
      }
      function hourlyForQuery(query) {
        var day = query && typeof query.day === 'string' ? query.day.slice(0, 10) : '';
        if (!day || day === dayKey(new Date())) return HOURLY;
        var row = seededDayRow(day);
        var weights = [0.2, 0.1, 0.1, 0.1, 0.2, 0.4, 0.9, 1.6, 2.4, 3.1, 3.4, 2.8, 2.1, 2.6, 3.3, 3.8, 3.1, 2.2, 1.4, 1.0, 0.8, 0.6, 0.4, 0.3];
        var weightSum = 0;
        for (var w = 0; w < weights.length; w += 1) weightSum += weights[w];
        var rows = [];
        for (var hour = 0; hour < 24; hour += 1) {
          var billable = Math.round((row.billable_total_tokens || 0) * (weights[hour] / weightSum));
          rows.push({
            hour: day + 'T' + pad(hour) + ':00:00',
            billable_total_tokens: billable,
            input_tokens: Math.round(billable * 0.27),
            output_tokens: Math.round(billable * 0.024),
            cached_input_tokens: Math.round(billable * 0.69),
            conversation_count: hour < 6 ? 0 : Math.max(0, Math.round(billable / 180000))
          });
        }
        return { day: day, rows: rows };
      }
      var last7 = sumRows(lastN(7));
      var last30 = sumRows(lastN(30));
      var allTotals = sumRows(DAILY);
      var active30 = lastN(30).filter(function (row) { return row.billable_total_tokens > 0; }).length;

      var SOURCE_SPECS = [
        {
          source: 'codex',
          share: 0.58,
          files: 312,
          models: [
            { model: 'gpt-5.4-codex', share: 0.47 },
            { model: 'gpt-5.2', share: 0.32 },
            { model: 'gpt-5.4-mini', share: 0.21 }
          ]
        },
        {
          source: 'dsh',
          share: 0.27,
          files: 141,
          models: [
            { model: 'deepseek-v4.1-flash', share: 0.62 },
            { model: 'deepseek-v4.1-pro', share: 0.38 }
          ]
        },
        {
          source: 'opencode',
          share: 0.15,
          files: 1,
          models: [
            { model: 'claude-sonnet-4-5', share: 0.49 },
            { model: 'glm-5', share: 0.3 },
            { model: 'deepseek-v4.1-flash', share: 0.21 }
          ]
        }
      ];
      var MODEL_COUNT_TOTAL = SOURCE_SPECS.reduce(function (sum, spec) { return sum + spec.models.length; }, 0);
      var MODEL_TOTAL = 1;
      SOURCE_SPECS.forEach(function (spec) { spec.tokensShare = spec.share * MODEL_TOTAL; });

      function breakdownFor(totals, sourcesFilter) {
        var total = totals.billable_total_tokens || 1;
        // A filtered query only reports the selected tools; their share is then
        // relative to the filtered total (which is what the real breakdown does).
        var specs = sourcesFilter
          ? SOURCE_SPECS.filter(function (spec) { return sourcesFilter.indexOf(spec.source) !== -1; })
          : SOURCE_SPECS;
        var filterShare = specs.reduce(function (sum, spec) { return sum + spec.share; }, 0) || 1;
        var sources = specs.map(function (spec) {
          return {
            source: spec.source,
            billable_total_tokens: Math.round(total * (spec.share / filterShare)),
            sharePct: (spec.share / filterShare) * 100,
            conversationCount: Math.round(totals.conversation_count * (spec.share / filterShare)),
            modelCount: spec.models.length,
            estimated: false
          };
        });
        var models = [];
        specs.forEach(function (spec) {
          spec.models.forEach(function (model) {
            models.push({
              source: spec.source,
              model: model.model,
              billable_total_tokens: Math.round(total * (spec.share / filterShare) * model.share),
              sharePct: (spec.share / filterShare) * model.share * 100,
              conversationCount: Math.round(totals.conversation_count * (spec.share / filterShare) * model.share),
              estimated: false
            });
          });
        });
        models.sort(function (a, b) { return b.billable_total_tokens - a.billable_total_tokens; });
        return { sources: sources, models: models };
      }

      function statusPayload() {
        // Fixed wall clock (today 09:15 local) so repeated captures are
        // pixel-identical; only the run date changes the mock.
        var scannedAtDate = new Date();
        scannedAtDate.setHours(9, 15, 0, 0);
        var scannedAt = scannedAtDate.toISOString();
        return {
          enabled: true,
          scanning: false,
          scan: null,
          lastScanAt: scannedAt,
          lastError: '',
          dbBytes: 4718592,
          retentionMonths: 24,
          sources: [
            { source: 'codex', label: 'Codex', state: 'ok', detected: true, readable: true, files: 312, lastError: null, coverageStartAt: isoStartOfDay(-180), estimated: false, lastScanAt: scannedAt },
            { source: 'dsh', label: 'DeepSeek Harness', state: 'ok', detected: true, readable: true, files: 141, lastError: null, coverageStartAt: isoStartOfDay(-120), estimated: false, lastScanAt: scannedAt },
            { source: 'opencode', label: 'OpenCode', state: 'ok', detected: true, readable: true, files: 1, lastError: null, coverageStartAt: isoStartOfDay(-160), estimated: false, lastScanAt: scannedAt },
            { source: 'cursor', label: 'Cursor', state: 'unsupported', detected: false, readable: false, files: 0, lastError: null, coverageStartAt: null, estimated: false, lastScanAt: null },
            { source: 'trae', label: 'TRAE', state: 'unsupported', detected: false, readable: false, files: 0, lastError: null, coverageStartAt: null, estimated: false, lastScanAt: null }
          ]
        };
      }

      function summaryFor(period) {
        var today = dayKey(new Date());
        if (period === 'day') {
          var dayTotals = sumRows(lastN(1));
          return { period: 'day', from: today, to: today, days: 1, totals: dayTotals, rolling: rollingPayload() };
        }
        if (period === 'week') {
          return { period: 'week', from: dayKey(dateOffset(-6)), to: today, days: 7, totals: last7, rolling: rollingPayload() };
        }
        if (period === 'custom') {
          return { period: 'custom', from: dayKey(dateOffset(-29)), to: today, days: 30, totals: last30, rolling: rollingPayload() };
        }
        if (period === 'total') {
          return { period: 'total', from: dayKey(dateOffset(-59)), to: today, days: 60, totals: allTotals, rolling: rollingPayload() };
        }
        return { period: 'month', from: dayKey(dateOffset(-29)), to: today, days: 30, totals: last30, rolling: rollingPayload() };
      }
      function rollingPayload() {
        return {
          last7d: { from: dayKey(dateOffset(-6)), to: dayKey(new Date()), billable_total_tokens: last7.billable_total_tokens, conversation_count: last7.conversation_count },
          last30d: { from: dayKey(dateOffset(-29)), to: dayKey(new Date()), billable_total_tokens: last30.billable_total_tokens, conversation_count: last30.conversation_count },
          avgPerActiveDay: active30 > 0 ? Math.round(last30.billable_total_tokens / active30) : 0,
          activeDays: active30
        };
      }
      function dailyFor(period) {
        if (period === 'day') return { period: 'day', rows: lastN(1) };
        if (period === 'week') return { period: 'week', rows: lastN(7) };
        if (period === 'custom') return { period: 'custom', rows: lastN(30) };
        if (period === 'total') return { period: 'total', rows: DAILY };
        return { period: 'month', rows: lastN(30) };
      }

      // 52-week heatmap, Monday-first columns ending with the week containing
      // today. Each cell carries the per-model split (models map) so a redesign
      // can surface per-model detail in the tooltip.
      function heatmapPayload() {
        var weeks = [];
        var today = new Date();
        today.setHours(12, 0, 0, 0);
        var monday = new Date(today);
        var weekday = (monday.getDay() + 6) % 7;
        monday.setDate(monday.getDate() - weekday - 51 * 7);
        var activityByDay = {};
        DAILY.forEach(function (row) { activityByDay[row.day] = row; });
        for (var w = 0; w < 52; w += 1) {
          var week = [];
          for (var d = 0; d < 7; d += 1) {
            var date = new Date(monday);
            date.setDate(monday.getDate() + w * 7 + d);
            var key = dayKey(date);
            if (date.getTime() > today.getTime() + DAY_MS * 3) {
              week.push(null);
              continue;
            }
            var row = activityByDay[key];
            var value = row ? row.billable_total_tokens : Math.round(Math.max(0, random() - 0.62) * 42000000);
            // 7 models for an active cell: the tooltip shows the top 5 plus the
            // "另有 N 个模型" line (v6 contract), so the overflow path is visible.
            var models = {};
            if (value > 0) {
              models['deepseek-v4.1-flash'] = Math.round(value * 0.31);
              models['gpt-5.4-codex'] = Math.round(value * 0.27);
              models['claude-sonnet-4-5'] = Math.round(value * 0.17);
              models['gpt-5.2'] = Math.round(value * 0.09);
              models['glm-5'] = Math.round(value * 0.07);
              models['gpt-5.4-mini'] = Math.round(value * 0.055);
              models['deepseek-v4.1-pro'] = Math.round(value * 0.035);
            }
            week.push({
              day: key,
              total_tokens: Math.round(value * 1.06),
              value: value,
              billable_total_tokens: value,
              level: 0,
              conversation_count: row ? row.conversation_count : Math.round(value / 24000),
              models: models
            });
          }
          weeks.push(week);
        }
        var max = 0;
        weeks.forEach(function (week) {
          week.forEach(function (cell) { if (cell && cell.value > max) max = cell.value; });
        });
        weeks.forEach(function (week) {
          week.forEach(function (cell) {
            if (!cell || max <= 0 || cell.value <= 0) { if (cell) cell.level = 0; return; }
            var ratio = cell.value / max;
            cell.level = ratio <= 0.25 ? 1 : ratio <= 0.5 ? 2 : ratio <= 0.75 ? 3 : 4;
          });
        });
        var activeDays = 0;
        weeks.forEach(function (week) {
          week.forEach(function (cell) { if (cell && cell.value > 0) activeDays += 1; });
        });
        return { weeks: weeks, activeDays: activeDays, from: dayKey(monday), to: dayKey(today) };
      }

      function hourlyPayload() {
        var today = dayKey(new Date());
        var rows = [];
        var weights = [0.2, 0.1, 0.1, 0.1, 0.2, 0.4, 0.9, 1.6, 2.4, 3.1, 3.4, 2.8, 2.1, 2.6, 3.3, 3.8, 3.1, 2.2, 1.4, 1.0, 0.8, 0.6, 0.4, 0.3];
        var dayRow = DAILY[DAILY.length - 1];
        var weightSum = weights.reduce(function (sum, value) { return sum + value; }, 0);
        for (var hour = 0; hour < 24; hour += 1) {
          var billable = Math.round((dayRow.billable_total_tokens || 0) * (weights[hour] / weightSum));
          rows.push({
            hour: today + 'T' + pad(hour) + ':00:00',
            billable_total_tokens: billable,
            input_tokens: Math.round(billable * 0.27),
            output_tokens: Math.round(billable * 0.024),
            cached_input_tokens: Math.round(billable * 0.69),
            conversation_count: hour < 6 ? 0 : Math.max(0, Math.round(billable / 180000))
          });
        }
        return { day: today, rows: rows };
      }

      var HEATMAP = heatmapPayload();
      // Filtered heatmap: same grid shape, values scaled by the selected tools'
      // share and levels recomputed max-relative (what the real query does).
      function scaledHeatmap(ids) {
        var ratio = sourceShareOf(ids);
        if (!ids || ratio === 1) return HEATMAP;
        var weeks = HEATMAP.weeks.map(function (week) {
          return week.map(function (cell) {
            if (!cell) return null;
            var value = Math.round((cell.value || 0) * ratio);
            var copy = JSON.parse(JSON.stringify(cell));
            copy.value = value;
            copy.billable_total_tokens = value;
            copy.total_tokens = Math.round((cell.total_tokens || 0) * ratio);
            copy.conversation_count = Math.round((cell.conversation_count || 0) * ratio);
            var models = {};
            Object.keys(cell.models || {}).forEach(function (model) { models[model] = Math.round(cell.models[model] * ratio); });
            copy.models = models;
            return copy;
          });
        });
        var max = 0;
        weeks.forEach(function (week) { week.forEach(function (cell) { if (cell && cell.value > max) max = cell.value; }); });
        var activeDays = 0;
        weeks.forEach(function (week) {
          week.forEach(function (cell) {
            if (!cell) return;
            if (cell.value > 0) activeDays += 1;
            cell.level = !max || cell.value <= 0 ? 0 : (cell.value / max <= 0.25 ? 1 : cell.value / max <= 0.5 ? 2 : cell.value / max <= 0.75 ? 3 : 4);
          });
        });
        return { weeks: weeks, activeDays: activeDays, from: HEATMAP.from, to: HEATMAP.to };
      }
      var HOURLY = hourlyPayload();
      // Day used by the tooltip capture mode: the active cell with the richest
      // per-model split (all active mock cells carry one; pick the busiest).
      var RICH_DAY = (function () {
        var best = null;
        HEATMAP.weeks.forEach(function (week) {
          week.forEach(function (cell) {
            if (!cell || !cell.value || !cell.models) return;
            var modelCount = Object.keys(cell.models).length;
            if (!best || modelCount > best.modelCount || (modelCount === best.modelCount && cell.value > best.value)) {
              best = { day: cell.day, value: cell.value, modelCount: modelCount };
            }
          });
        });
        return best ? best.day : null;
      })();
      window.__usagePreviewRichDay = RICH_DAY;
      window.__usagePreviewMock = {
        today: dayKey(new Date()),
        sourceCount: SOURCE_SPECS.length,
        modelCount: MODEL_COUNT_TOTAL,
        dailyRows: DAILY.length,
        heatmapWeeks: HEATMAP.weeks.length,
        heatmapActiveDays: HEATMAP.activeDays,
        richDay: RICH_DAY,
        totals: {
          billable_total_tokens: allTotals.billable_total_tokens,
          conversation_count: allTotals.conversation_count
        }
      };

      function payloadFor(period) {
        var summary = summaryFor(period);
        var breakdown = breakdownFor(summary.totals);
        return {
          status: statusPayload(),
          summary: summary,
          daily: dailyFor(period),
          breakdown: breakdown,
          trend: { rows: last30 },
          heatmap: HEATMAP,
          hourly: period === 'day' ? HOURLY : null
        };
      }

      var settings = {
        language: 'zh-CN',
        theme: 'system',
        usage: { enabled: true }
      };
      window.__usagePreviewSettings = settings;

      function resolve(value) {
        return new Promise(function (resolvePromise) {
          setTimeout(function () { resolvePromise(value); }, 0);
        });
      }

      window.electronAPI = {
        usageStatus: function () { return resolve(statusPayload()); },
        usageSummary: function (query) { return resolve(summaryForQuery(query)); },
        usageDaily: function (query) { return resolve(dailyForQuery(query)); },
        usageBreakdown: function (query) { return resolve(breakdownFor(summaryForQuery(query).totals, selectedSources(query))); },
        usageHeatmap: function (query) { return resolve(scaledHeatmap(selectedSources(query))); },
        usageHourly: function (query) {
          var debug = { called: true, query: query || null, day: query && query.day, emptyFlag: !!window.__usagePreviewEmptyHourly, rows: null, error: null };
          try {
            if (window.__usagePreviewEmptyHourly) {
              var emptyDay = (query && typeof query.day === 'string') ? query.day.slice(0, 10) : dayKey(new Date());
              debug.rows = 0;
              window.__usagePreviewHourlyDebug = debug;
              return resolve({ day: emptyDay, rows: [] });
            }
            var payload = hourlyForQuery(query);
            debug.rows = payload && payload.rows ? payload.rows.length : null;
            debug.day = payload && payload.day;
            window.__usagePreviewHourlyDebug = debug;
            return resolve(payload);
          } catch (error) {
            debug.error = error && error.message ? error.message : String(error);
            window.__usagePreviewHourlyDebug = debug;
            return Promise.reject(error);
          }
        },
        usageRefresh: function () { return resolve({ started: true, reason: 'manual' }); },
        usageClear: function () { return resolve({ ok: true }); },
        onUsageScanProgress: function () { return function () {}; },
        getSettings: function () { return resolve(settings); },
        updateSettings: function () { return resolve(settings); },
        windowMinimize: function () {},
        windowClose: function () {},
        onNavigate: function () { return function () {}; },
        onGameModeChanged: function () { return function () {}; },
        onHistoryChanged: function () { return function () {}; },
        onUpdateStatus: function () { return function () {}; },
        onInterfaceLanguage: function () { return function () {}; }
      };
    })();
  </script>

  <script>
    // ── Static shell bootstrap (stand-in for config/config.js) ────────────────
    (function () {
      'use strict';
      var params = new URLSearchParams(location.search);
      var requestedTheme = params.get('theme') === 'dark' ? 'dark' : 'light';
      var requestedPeriod = params.get('period');
      var requestedLanguage = params.get('lang') === 'en-US' ? 'en-US' : params.get('lang') === 'zh-TW' ? 'zh-TW' : 'zh-CN';

      function dashboardReady(period) {

        if (period && viewPeriod && viewPeriod.getAttribute('data-usage-view') !== period) return false;
        return Boolean(page.querySelector('#usageKpis')) && Boolean(page.querySelector('#usageBreakdown'));
      }

      function waitFor(condition, timeoutMs) {
        return new Promise(function (resolve, reject) {
          var deadline = Date.now() + timeoutMs;
          (function poll() {
            if (condition()) return resolve(true);
            if (Date.now() > deadline) return reject(new Error('preview render timed out'));
            requestAnimationFrame(poll);
          })();
        });
      }

      function selectPeriod(period) {
        if (!period || period === 'month') return Promise.resolve(false);
        var button = document.querySelector('[data-usage-tab="' + period + '"]');
        if (!button) return Promise.resolve(false);
        button.click();
        return waitFor(function () {
          var page = document.querySelector('.usage-page');
          var viewPeriod = page && page.querySelector('[data-usage-view]');
          return Boolean(viewPeriod) && viewPeriod.getAttribute('data-usage-view') === period;
        }, 15000).then(function () { return true; });
      }

      // AI-tool filter drivers (dev harness only). The chips are the page's real
      // control, so a capture exercises the same handler path a user click does.
      function activeFilters() {
        return Array.prototype.slice.call(document.querySelectorAll('[data-usage-source-filter][aria-pressed="true"]'))
          .map(function (chip) { return chip.getAttribute('data-usage-source-filter'); });
      }
      function filterSettled() {
        var page = document.querySelector('.usage-page');
        return Boolean(page) && page.getAttribute('data-usage-busy') !== 'true';
      }
      function applyFilter(ids) {
        for (var i = 0; i < ids.length; i += 1) {
          var chip = document.querySelector('[data-usage-source-filter="' + ids[i] + '"]');
          if (!chip) return Promise.reject(new Error('filter chip not found: ' + ids[i]));
          if (chip.getAttribute('aria-pressed') !== 'true') chip.click();
        }
        return waitFor(filterSettled, 15000)
          .then(function () { return new Promise(function (resolve) { setTimeout(resolve, 160); }); })
          .then(function () {
            // The capture must not show the clicked chip's focus ring.
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            return activeFilters();
          });
      }
      function clearFilter() {
        var chip = document.querySelector('[data-usage-source-filter="all"]');
        if (!chip) return Promise.resolve([]);
        if (chip.getAttribute('aria-pressed') !== 'true') chip.click();
        return waitFor(filterSettled, 15000)
          .then(function () { return new Promise(function (resolve) { setTimeout(resolve, 160); }); })
          .then(function () {
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            return activeFilters();
          });
      }
      window.__usagePreviewApplyFilter = applyFilter;
      window.__usagePreviewClearFilter = clearFilter;
      window.__usagePreviewActiveFilters = activeFilters;

      Promise.resolve(window.configRoutes.renderUsage())
        .then(function () { return waitFor(function () { return dashboardReady(); }, 15000); })
        .then(function () { return selectPeriod(requestedPeriod); })
        .then(function () {
          // `filter` query param pre-selects chips for a filtered capture; the
          // value is a comma list (codex,dsh) rendered through the real handlers.
          var filterParam = params.get('filter');
          if (!filterParam) return null;
          var ids = filterParam.split(',').map(function (item) { return item.trim(); }).filter(Boolean);
          return ids.length > 0 ? applyFilter(ids) : null;
        })
        .then(function () {
          return Promise.all([
            document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve(),
            new Promise(function (resolve) { requestAnimationFrame(function () { requestAnimationFrame(resolve); }); })
          ]);
        })
        .then(function () {
          // Let delayed card rendering (heatmap/tooltip sizing) settle.
          return new Promise(function (resolve) { setTimeout(resolve, 120); });
        })
        .then(function () {
          var page = document.querySelector('.usage-page');
          window.__usagePreviewMeasure = function () {
            var page = document.querySelector('.usage-page');
            var viewElement = document.getElementById('view');
            var heatScroll = document.querySelector('[data-usage-heatmap-scroll], .usage-heatmap-scroll');
            var heatGrid = document.querySelector('.usage-heatmap-grid, .usage-heat-grid, .usage-heat-canvas');
            var heatCells = heatGrid ? Array.prototype.slice.call(heatGrid.querySelectorAll('.usage-heat-cell, [data-usage-heat-day]')) : [];
            var heatCard = document.querySelector('.usage-heatmap');
            function rect(element) {
              if (!element) return null;
              var r = element.getBoundingClientRect();
              return { left: r.left, top: r.top, width: r.width, height: r.height, right: r.right, bottom: r.bottom };
            }
            return {
              windowInnerWidth: window.innerWidth,
              viewClientWidth: viewElement ? viewElement.clientWidth : null,
              viewRect: rect(viewElement),
              pageWidth: page ? page.getBoundingClientRect().width : null,
              pageRect: rect(page),
              heatmapCardRect: rect(heatCard),
              heatmapScrollClientWidth: heatScroll ? heatScroll.clientWidth : null,
              heatmapScrollWidth: heatScroll ? heatScroll.scrollWidth : null,
              tableMetrics: (function () {
                var wrap = document.querySelector('.usage-daily .usage-table-wrap');
                var rows = wrap ? Array.prototype.slice.call(wrap.querySelectorAll('tbody tr')) : [];
                if (!wrap) return null;
                var wr = wrap.getBoundingClientRect();
                var visible = rows.filter(function (row) {
                  var rr = row.getBoundingClientRect();
                  return rr.top >= wr.top - 1 && rr.bottom <= wr.bottom + 1;
                });
                var lastPartial = rows.some(function (row) {
                  var rr = row.getBoundingClientRect();
                  return rr.top < wr.bottom - 1 && rr.bottom > wr.bottom + 1;
                });
                var fullyVisible = visible.slice().sort(function (a, b) { return a.getBoundingClientRect().top - b.getBoundingClientRect().top; });
                var lastFullyVisible = fullyVisible.length > 0 ? fullyVisible[fullyVisible.length - 1] : null;
                var lastBottom = lastFullyVisible ? lastFullyVisible.getBoundingClientRect().bottom : null;
                var nextRow = rows.filter(function (row) { return row.getBoundingClientRect().top >= wr.bottom - 0.5; })[0] || null;
                return {
                  clientHeight: wrap.clientHeight,
                  scrollHeight: wrap.scrollHeight,
                  rows: rows.length,
                  fullyVisibleRows: visible.length,
                  lastRowCut: lastPartial,
                  lastVisibleRowBottomGapPx: lastBottom === null ? null : Math.round(wr.bottom - lastBottom),
                  nextRowTopGapPx: nextRow ? Math.round(nextRow.getBoundingClientRect().top - wr.bottom) : null
                };
              })(),
              cardRects: {
                main: rect(document.querySelector('.usage-main')),
                models: rect(document.querySelector('#usageBreakdown')),
                trend: rect(document.querySelector('.usage-trend')),
                daily: rect(document.querySelector('.usage-daily')),
                heatmap: rect(document.querySelector('#usageHeatmap')),
                hero: rect(document.querySelector('.usage-hero')),
                kpis: rect(document.querySelector('#usageKpis'))
              },
              heatmapContentWidth: heatCells.length > 0
                ? Math.round(Math.max.apply(null, heatCells.map(function (c) { return c.getBoundingClientRect().right; })) - Math.min.apply(null, heatCells.map(function (c) { return c.getBoundingClientRect().left; })))
                : null,
              heatmapLeftDeadSpacePx: (function () {
                if (!heatScroll || heatCells.length === 0) return null;
                var leftMost = Math.min.apply(null, heatCells.map(function (c) { return c.getBoundingClientRect().left; }));
                return Math.max(0, Math.round(leftMost - heatScroll.getBoundingClientRect().left));
              })(),
              heatmapDeadSpacePx: (function () {
                if (!heatScroll || heatCells.length === 0) return null;
                var rightMost = Math.max.apply(null, heatCells.map(function (c) { return c.getBoundingClientRect().right; }));
                return Math.max(0, Math.round(heatScroll.getBoundingClientRect().right - rightMost));
              })(),
              heatmapMarginDeltaPx: (function () {
                if (!heatScroll || heatCells.length === 0) return null;
                var scrollRect = heatScroll.getBoundingClientRect();
                var leftMost = Math.min.apply(null, heatCells.map(function (c) { return c.getBoundingClientRect().left; }));
                var rightMost = Math.max.apply(null, heatCells.map(function (c) { return c.getBoundingClientRect().right; }));
                return Math.round(Math.abs((leftMost - scrollRect.left) - (scrollRect.right - rightMost)));
              })(),
              documentHeight: Math.max(document.documentElement.scrollHeight, document.body.scrollHeight)
            };
          };
          window.__usagePreviewReady = true;
          window.__usagePreviewStats = {
            theme: requestedTheme,
            language: requestedLanguage,
            compact: compact,
            period: requestedPeriod || 'month',
            activeFilters: activeFilters(),
            filterChips: document.querySelectorAll('[data-usage-source-filter]').length,
            pageState: page ? page.getAttribute('data-usage-state') : null,
            providerCards: document.querySelectorAll('.usage-provider').length,
            providerAllText: (function () {
              var all = document.querySelector('.usage-provider-all');
              return all ? all.textContent.replace(/\s+/g, ' ').trim() : null;
            })(),
            sourceCards: document.querySelectorAll('.usage-source-card').length,
            modelRows: document.querySelectorAll('.usage-model-row').length,
            modelCountMock: window.__usagePreviewMock ? window.__usagePreviewMock.modelCount : null,
            richDay: window.__usagePreviewMock ? window.__usagePreviewMock.richDay : null,
            trendColumns: document.querySelectorAll('.usage-trend-col').length,
            dailyRows: document.querySelectorAll('#usageDailyTable tbody tr').length,
            heatmapCells: document.querySelectorAll('.usage-heat-cell:not(.usage-heat-empty):not(.is-empty)').length,
            heatmapActiveCells: document.querySelectorAll('[data-usage-heat-day]').length,
            heatmapAllCells: document.querySelectorAll('.usage-heat-cell').length,
            hourlyBars: document.querySelectorAll('.usage-hourly-bar').length,
            errors: window.__usagePreviewErrors.slice()
          };
          console.info('usage preview ready', JSON.stringify(window.__usagePreviewStats));
        })
        .catch(function (error) {
          window.__usagePreviewErrors.push('bootstrap: ' + (error && error.message ? error.message : String(error)));
          window.__usagePreviewMeasure = function () {
            var page = document.querySelector('.usage-page');
            var viewElement = document.getElementById('view');
            var heatScroll = document.querySelector('[data-usage-heatmap-scroll]');
            var heatGrid = document.querySelector('.usage-heatmap-grid');
            var heatCells = heatGrid ? Array.prototype.slice.call(heatGrid.querySelectorAll('.usage-heat-cell')) : [];
            var heatCard = document.querySelector('.usage-heatmap');
            function rect(element) {
              if (!element) return null;
              var r = element.getBoundingClientRect();
              return { left: r.left, top: r.top, width: r.width, height: r.height, right: r.right, bottom: r.bottom };
            }
            return {
              windowInnerWidth: window.innerWidth,
              viewClientWidth: viewElement ? viewElement.clientWidth : null,
              viewRect: rect(viewElement),
              pageWidth: page ? page.getBoundingClientRect().width : null,
              pageRect: rect(page),
              heatmapCardRect: rect(heatCard),
              heatmapScrollClientWidth: heatScroll ? heatScroll.clientWidth : null,
              heatmapScrollWidth: heatScroll ? heatScroll.scrollWidth : null,
              tableMetrics: (function () {
                var wrap = document.querySelector('.usage-daily .usage-table-wrap');
                var rows = wrap ? Array.prototype.slice.call(wrap.querySelectorAll('tbody tr')) : [];
                if (!wrap) return null;
                var wr = wrap.getBoundingClientRect();
                var visible = rows.filter(function (row) {
                  var rr = row.getBoundingClientRect();
                  return rr.top >= wr.top - 1 && rr.bottom <= wr.bottom + 1;
                });
                var lastPartial = rows.some(function (row) {
                  var rr = row.getBoundingClientRect();
                  return rr.top < wr.bottom - 1 && rr.bottom > wr.bottom + 1;
                });
                return { clientHeight: wrap.clientHeight, scrollHeight: wrap.scrollHeight, rows: rows.length, fullyVisibleRows: visible.length, lastRowCut: lastPartial };
              })(),
              cardRects: {
                main: rect(document.querySelector('.usage-main')),
                models: rect(document.querySelector('#usageBreakdown')),
                trend: rect(document.querySelector('.usage-trend')),
                daily: rect(document.querySelector('.usage-daily')),
                heatmap: rect(document.querySelector('#usageHeatmap')),
                hero: rect(document.querySelector('.usage-hero')),
                kpis: rect(document.querySelector('#usageKpis'))
              },
              heatmapContentWidth: heatCells.length > 0
                ? Math.round(Math.max.apply(null, heatCells.map(function (c) { return c.getBoundingClientRect().right; })) - Math.min.apply(null, heatCells.map(function (c) { return c.getBoundingClientRect().left; })))
                : null,
              heatmapDeadSpacePx: (function () {
                if (!heatScroll || heatCells.length === 0) return null;
                var rightMost = Math.max.apply(null, heatCells.map(function (c) { return c.getBoundingClientRect().right; }));
                return Math.max(0, Math.round(heatScroll.getBoundingClientRect().right - rightMost));
              })(),
              documentHeight: Math.max(document.documentElement.scrollHeight, document.body.scrollHeight)
            };
          };
          window.__usagePreviewReady = true;
          window.__usagePreviewStats = { error: String(error && error.message ? error.message : error), errors: window.__usagePreviewErrors.slice() };
          console.error('usage preview failed', error);
        });
    })();
  </script>
