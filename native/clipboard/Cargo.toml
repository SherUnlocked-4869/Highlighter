[package]
name = "highlighter-clipboard"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
sha2 = "0.10.9"
uuid = { version = "1.18", features = ["v4"] }
image = { version = "0.25.10", default-features = false, features = ["png", "bmp"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory",
  "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi",
  "Win32_System_StationsAndDesktops", "Win32_Security", "Win32_System_Threading",
  "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Pipes",
  "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_System_RemoteDesktop",
  "Win32_UI_Input_KeyboardAndMouse"
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lib]
name = "highlighter_clipboard"
path = "src/lib.rs"
