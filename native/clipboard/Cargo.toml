[package]
name = "highlighter-clipboard"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory",
  "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi",
  "Win32_System_StationsAndDesktops", "Win32_Security", "Win32_System_Threading"
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lib]
name = "highlighter_clipboard"
path = "src/lib.rs"
