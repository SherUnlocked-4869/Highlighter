[package]
name = "highlighter-everything"
version = "0.1.0"
edition = "2021"
description = "Highlighter Everything sidecar: JSON-lines bridge to Everything IPC"

[dependencies]
serde_json = "1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
