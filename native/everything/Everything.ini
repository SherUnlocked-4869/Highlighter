; Clean Everything configuration template for Highlighter's bundled instance.
; Highlighter copies this file next to its portable Everything.exe (inside the
; app data runtime directory) and starts it with:
;   Everything.exe -startup -config Everything.ini
; Everything fills in defaults for any key that is missing. Missing keys on
; purpose: database location (default per-user path), volumes (auto detect).

ipc=1
ipc_pipe=1
run_in_background=1
check_for_updates_on_startup=0
allow_multiple_instances=0
