<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'">
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;user-select:none}
body{border-radius:7px}
body.long-capture{overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.45) transparent}
body::after{content:"";position:fixed;z-index:2;inset:0;border-radius:7px;box-shadow:inset 0 1px rgba(255,255,255,.26),inset 1px 0 rgba(255,255,255,.18),inset 0 -1px rgba(0,0,0,.42),inset -1px 0 rgba(0,0,0,.32),inset 0 0 5px rgba(0,0,0,.16);pointer-events:none}
.pin-surface{display:block;width:100vw;height:auto;border-radius:6px;cursor:grab;touch-action:none}
.pin-surface.pixel-native{image-rendering:pixelated}
.hidden{display:none}
body.dragging .pin-surface{cursor:grabbing}
#zoomBadge{position:fixed;z-index:3;left:50%;top:10px;transform:translateX(-50%);padding:4px 8px;border-radius:5px;color:#fff;background:rgba(20,20,22,.76);font:12px/1.2 Consolas,monospace;opacity:0;pointer-events:none;transition:opacity .15s}
#zoomBadge.show{opacity:1}
</style>
</head>
<body>
<img id="image" class="pin-surface hidden" draggable="false">
<canvas id="pixelImage" class="pin-surface hidden"></canvas>
<div id="zoomBadge">100%</div>
<script src="pin.js"></script>
</body>
</html>
