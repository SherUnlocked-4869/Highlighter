<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'">
<link rel="stylesheet" href="pin.css">
<!-- The locale tables and the runtime must load before pin.js (plan §10.3). -->
<script src="../shared/locales/zh-CN.js"></script>
<script src="../shared/locales/en-US.js"></script>
<script src="../shared/locales/zh-TW.js"></script>
<script src="../shared/locales/capture.js"></script>
<script src="../shared/locales/pin.js"></script>
<script src="../shared/i18n.js"></script>
<script src="../shared/ocr-text-overlay.js"></script>
</head>
<body data-rotation="0">
<!-- #rotor is the rotation frame (P1, plan §9.3): the main process already sized
     the window to the rotated bounding box, so this wrapper only has to lay the
     surface out at the pre-rotation size and rotate it. The badges stay outside
     it so they remain upright. -->
<div id="rotor">
<img id="image" class="pin-surface hidden" draggable="false">
<canvas id="pixelImage" class="pin-surface hidden"></canvas>
<div id="pinOcrOverlay"></div>
</div>
<div id="pinRecognitionStatus" role="status" hidden></div>
<div id="pinRecognitionTools" hidden>
  <button type="button" id="pinToggleSource"></button>
  <button type="button" id="pinCopyText" data-i18n="capture.ocr.copy-all"></button>
  <button type="button" id="pinPlainText" data-i18n="pin.recognition.plain-text"></button>
  <button type="button" id="pinHideResult" data-i18n="pin.recognition.hide"></button>
</div>
<textarea id="pinRecognizedText" readonly hidden data-i18n-aria-label="pin.recognition.plain-text"></textarea>
<div id="zoomBadge">100%</div>
<div id="opacityBadge" data-i18n-title="pin.opacity.title" title="Opacity">100%</div>
<div id="clickThroughTag" data-i18n="pin.click-through.label" data-i18n-title="pin.click-through.title" title="Click-through active">Click-through · hover to exit</div>
<!-- N05: transient operation toast shared by the onion-skin modes and the workspace
     snapshot actions. Text always comes from t(), never from static markup. -->
<div id="pinToast" role="status" hidden></div>
<!-- N05: inline snapshot naming. The pin window is the only surface that can own a
     text input without a new IPC channel, and a native prompt() does not exist in
     Electron. The overlay is pointer-transparent until opened. -->
<div id="pinWorkspaceNaming" hidden>
  <div id="pinWorkspaceNamingTitle" data-i18n="pin.workspace.naming-title"></div>
  <input id="pinWorkspaceNameInput" type="text" maxlength="64" autocomplete="off" spellcheck="false" data-i18n-placeholder="pin.workspace.naming-placeholder">
  <div id="pinWorkspaceNamingHint" data-i18n="pin.workspace.naming-hint"></div>
  <div id="pinWorkspaceNamingActions">
    <button type="button" id="pinWorkspaceNameCancel" data-i18n="pin.workspace.naming-cancel"></button>
    <button type="button" id="pinWorkspaceNameConfirm" data-i18n="pin.workspace.naming-confirm"></button>
  </div>
</div>
<script src="pin.js"></script>
</body>
</html>
