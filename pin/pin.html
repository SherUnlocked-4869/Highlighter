<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'">
<link rel="stylesheet" href="pin.css">
<!-- The locale tables and the runtime must load before pin.js (plan §10.3). -->
<script src="../shared/locales/zh-CN.js"></script>
<script src="../shared/locales/en-US.js"></script>
<script src="../shared/locales/zh-TW.js"></script>
<script src="../shared/locales/pin.js"></script>
<script src="../shared/i18n.js"></script>
</head>
<body data-rotation="0">
<!-- #rotor is the rotation frame (P1, plan §9.3): the main process already sized
     the window to the rotated bounding box, so this wrapper only has to lay the
     surface out at the pre-rotation size and rotate it. The badges stay outside
     it so they remain upright. -->
<div id="rotor">
<img id="image" class="pin-surface hidden" draggable="false">
<canvas id="pixelImage" class="pin-surface hidden"></canvas>
</div>
<div id="zoomBadge">100%</div>
<div id="opacityBadge" data-i18n-title="pin.opacity.title" title="Opacity">100%</div>
<div id="clickThroughTag" data-i18n="pin.click-through.label" data-i18n-title="pin.click-through.title" title="Click-through active">Click-through · hover to exit</div>
<script src="pin.js"></script>
</body>
</html>
