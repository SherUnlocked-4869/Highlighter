<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- P0-1-T5 (S12): the markup carries the English fallback; recognition.js calls
       applyTranslations() synchronously at load, so a zh-CN window renders the
       Chinese copy on the first frame (acceptance ⑤). -->
  <title data-i18n="recognition.title.window">Recognition result</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="recognition.css">
  <!-- The locale tables and the runtime must load before recognition.js. -->
  <script src="../shared/locales/zh-CN.js"></script>
  <script src="../shared/locales/en-US.js"></script>
  <script src="../shared/locales/zh-TW.js"></script>
  <script src="../shared/locales/recognition.js"></script>
  <script src="../shared/i18n.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-copy">
      <h1 id="title" data-i18n="recognition.header.title">Recognition result</h1>
      <p id="summary"></p>
    </div>
    <span id="badge" class="badge" data-i18n="recognition.badge.local-ocr">Local OCR</span>
    <button id="close" class="icon-button" data-i18n-title="recognition.header.close" data-i18n-aria-label="recognition.header.close" title="Close" aria-label="Close">×</button>
  </header>

  <main>
    <div id="loading" class="loading"><span></span><b id="loadingText" data-i18n="recognition.status.loading">Processing…</b></div>
    <div id="error" class="error hidden"><strong data-i18n="recognition.error.title">Recognition failed</strong><p id="errorText"></p></div>
    <div id="tableView" class="table-view hidden"><table id="table"></table></div>
    <div id="qrView" class="qr-view hidden"><textarea id="qrText" readonly data-i18n-aria-label="recognition.qr.content-label" aria-label="QR-code content"></textarea></div>
  </main>

  <footer id="actions" class="actions hidden">
    <select id="format" class="hidden" data-i18n-title="recognition.format.label" title="Copy format">
      <option value="tsv" data-i18n="recognition.format.tsv">TSV (paste into a spreadsheet)</option>
      <option value="csv">CSV</option>
      <option value="markdown">Markdown</option>
    </select>
    <button id="openLink" class="hidden" data-i18n="recognition.action.open-link">Open link</button>
    <button id="copy" class="primary" data-i18n="recognition.action.copy">Copy</button>
  </footer>

  <script src="../node_modules/jsqr/dist/jsQR.js"></script>
  <script src="recognition.js"></script>
</body>
</html>
