[workspace]

[package]
name = "credential-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false
description = "R0 synthetic credential probe: Electron safeStorage (OSCrypt v10 + DPAPI-wrapped key) <-> Rust (not a product component)"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
