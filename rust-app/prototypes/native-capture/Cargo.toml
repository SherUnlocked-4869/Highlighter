[package]
name = "native-capture"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

# R0-05b 原型独立工程：空 workspace 表，避免并入 rust-app 父 workspace。
# 父 workspace（rust-app/Cargo.toml）members 不包含 prototypes/*，两边互不影响。
[workspace]

[dependencies]
# 用 windows crate 而不是 windows-sys：需要 WinRT COM 包装类型
# （Windows.Graphics.Capture / Windows.Foundation.TypedEventHandler）与 WASAPI COM 接口。
windows = { version = "=0.62.2", features = [
  "Foundation",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
