<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Highlighter R0-03 overlay prototype</title>
  <style>
    /* 透明窗口的关键：html/body 必须透明，否则 WebView2 会铺白底，
       transparent=true 的窗口也看不到底层桌面。 */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      cursor: crosshair;
    }

    #prototype-canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      background: transparent;
    }

    #prototype-hud {
      position: fixed;
      left: 16px;
      bottom: 16px;
      max-width: calc(100vw - 32px);
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 8px;
      background: rgba(20, 20, 24, 0.72);
      color: #f5f5f7;
      font: 12px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
      white-space: pre-wrap;
      pointer-events: none;
      user-select: none;
    }

    #prototype-hud[data-state="error"] {
      border-color: #ff3b30;
      color: #ffd7d3;
    }

    #prototype-hud[data-state="ready"] {
      border-color: #34c759;
    }
  </style>
</head>
<body>
  <canvas id="prototype-canvas"></canvas>
  <aside id="prototype-hud" data-state="booting">R0-03 原型：等待宿主 init…</aside>
  <script src="canvas.js"></script>
</body>
</html>
