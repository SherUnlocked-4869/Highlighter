<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- P0-1-T5 (S12): the markup carries the English fallback; search.js calls
       applyTranslations() synchronously at load, so a zh-CN window renders the
       Chinese copy on the first frame (acceptance ⑤). -->
  <title data-i18n="search.title.window">Local search</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="search.css">
  <!-- The locale tables and the runtime must load before search-utils.js/search.js. -->
  <script src="../shared/locales/zh-CN.js"></script>
  <script src="../shared/locales/en-US.js"></script>
  <script src="../shared/locales/zh-TW.js"></script>
  <script src="../shared/locales/search.js"></script>
  <script src="../shared/i18n.js"></script>
</head>
<body>
  <div class="search-shell">
    <header class="search-top">
      <div class="search-box">
        <img class="search-glyph" src="icons/search.svg" alt="">
        <input id="searchInput" type="text" data-i18n-placeholder="search.input.placeholder" placeholder="Search local files (Everything syntax works, e.g. ext:pdf report)" autocomplete="off" spellcheck="false">
        <button id="clearInput" class="ghost-button" data-i18n-title="search.input.clear" title="Clear" hidden>✕</button>
      </div>
      <button id="closeWindow" class="ghost-button" data-i18n-title="search.window.close" title="Close (Esc)">✕</button>
    </header>
    <nav class="category-tabs" id="categoryTabs" data-i18n-aria-label="search.tabs.label" aria-label="Search categories"></nav>
    <main class="result-list" id="resultList"></main>
    <div class="result-empty" id="emptyState" data-i18n="search.empty.prompt">Type a keyword to start searching</div>
    <footer class="search-footer">
      <span class="status" id="statusText" data-i18n="search.status.detecting">Detecting Everything...</span>
      <span class="footer-spacer"></span>
      <label class="footer-toggle" data-i18n-title="search.toggle.match-path-title" title="Match both the file name and the full path"><input type="checkbox" id="matchPathToggle"><span data-i18n="search.toggle.match-path">Match path</span></label>
      <select id="sortSelect" class="sort-select" data-i18n-title="search.sort.label" title="Sort order"></select>
      <span class="count" id="countText"></span>
    </footer>
  </div>
  <script src="search-utils.js"></script>
  <script src="search.js"></script>
</body>
</html>
