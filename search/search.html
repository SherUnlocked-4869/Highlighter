<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- P0-1-T5 (S12): the markup carries the English fallback; search.js calls
       applyTranslations() synchronously at load, so a zh-CN window renders the
       Chinese copy on the first frame (acceptance ⑤). -->
  <title data-i18n="search.title.window">Local search</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="search.css">
  <!-- The locale tables and the runtime must load before search-utils.js/search.js. -->
  <script src="../shared/locales/zh-CN.js"></script>
  <script src="../shared/locales/en-US.js"></script>
  <script src="../shared/locales/zh-TW.js"></script>
  <script src="../shared/locales/search.js"></script>
  <!-- The footer status line re-resolves the `main.everything.*` keys the
       Everything sidecar publishes (main/services/everything-service.js) after a
       language switch, so the search window has to load that domain table too
       (same rule as config.html, which loads config.js + toolbar.js +
       search.js). -->
  <script src="../shared/locales/main.js"></script>
  <script src="../shared/i18n.js"></script>
</head>
<body>
  <div class="search-shell">
    <header class="search-top">
      <div class="search-box">
        <img class="search-glyph" src="icons/search.svg" alt="">
        <input id="searchInput" type="text" role="searchbox" data-i18n-aria-label="search.title.window" aria-label="Local search" data-i18n-placeholder="search.input.placeholder" placeholder="Search local files (Everything syntax works, e.g. ext:pdf report)" autocomplete="off" spellcheck="false">
        <button id="clearInput" class="ghost-button" type="button" data-i18n-title="search.input.clear" data-i18n-aria-label="search.input.clear" title="Clear" aria-label="Clear" hidden>✕</button>
      </div>
      <button id="closeWindow" class="ghost-button" type="button" data-i18n-title="search.window.close" data-i18n-aria-label="search.window.close" title="Close (Esc)" aria-label="Close (Esc)">✕</button>
    </header>
    <nav class="category-tabs" id="categoryTabs" data-i18n-aria-label="search.tabs.label" aria-label="Search categories"></nav>
    <main class="result-list" id="resultList"></main>
    <div class="result-empty" id="emptyState" data-i18n="search.empty.prompt">Type a keyword to start searching</div>
    <!-- N04 (review report section 5.4): Space Quick Look. The overlay is a
         read-only sibling of the list: it never takes focus, so typing, the
         category tabs and the shortcut keys keep working while it is open. The
         body is an aria-live region so a screen reader hears each new preview,
         and the close button carries its own translated aria-label. -->
    <section id="quickLook" class="quick-look" role="dialog" aria-modal="false" aria-labelledby="quickLookTitle" hidden>
      <header class="quick-look-head">
        <span class="quick-look-icon" id="quickLookIcon" aria-hidden="true"></span>
        <div class="quick-look-heading">
          <div class="quick-look-title" id="quickLookTitle"></div>
          <div class="quick-look-path" id="quickLookPath"></div>
        </div>
        <button id="quickLookClose" class="ghost-button" type="button" data-i18n-aria-label="search.preview.close" aria-label="Close preview">✕</button>
      </header>
      <div class="quick-look-body" id="quickLookBody" role="document" aria-live="polite" aria-atomic="true" data-state="idle"></div>
      <footer class="quick-look-foot">
        <span class="quick-look-meta" id="quickLookMeta"></span>
        <span class="quick-look-hint" data-i18n="search.preview.hint">Press Space to close the preview</span>
      </footer>
    </section>
    <span class="visually-hidden" id="resultStatus" role="status"></span>
    <footer class="search-footer">
      <span class="status" id="statusText" data-i18n="search.status.detecting">Detecting Everything...</span>
      <span class="footer-spacer"></span>
      <label class="footer-toggle" data-i18n-title="search.toggle.match-path-title" title="Match both the file name and the full path"><input type="checkbox" id="matchPathToggle"><span data-i18n="search.toggle.match-path">Match path</span></label>
      <select id="sortSelect" class="sort-select" data-i18n-title="search.sort.label" data-i18n-aria-label="search.sort.label" title="Sort order" aria-label="Sort order"></select>
      <span class="count" id="countText"></span>
    </footer>
  </div>
  <script src="search-utils.js"></script>
  <script src="search.js"></script>
</body>
</html>
