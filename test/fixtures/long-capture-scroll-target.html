<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Highlighter 自动长截图测试页</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: auto; }
    body {
      margin: 0;
      color: #182230;
      background: #eef2f7;
      font: 16px/1.6 "Segoe UI", sans-serif;
    }
    header, footer {
      position: fixed;
      z-index: 2;
      left: 0;
      right: 0;
      height: 54px;
      display: flex;
      align-items: center;
      padding: 0 28px;
      color: white;
      background: #1468d4;
    }
    header { top: 0; }
    footer { bottom: 0; justify-content: space-between; background: #25364d; }
    #pulse {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffcc00;
      animation: pulse .7s infinite alternate;
    }
    @keyframes pulse { to { transform: scale(1.5); opacity: .45; } }
    main {
      width: min(880px, calc(100% - 48px));
      margin: 0 auto;
      padding: 78px 0 80px;
    }
    section {
      min-height: 230px;
      margin: 0 0 18px;
      padding: 28px;
      border: 1px solid #cbd6e4;
      border-radius: 12px;
      background: white;
      box-shadow: 0 5px 18px rgba(36, 57, 84, .08);
    }
    section:nth-child(3n+1) { border-left: 8px solid #16a085; }
    section:nth-child(3n+2) { border-left: 8px solid #8e44ad; }
    section:nth-child(3n) { border-left: 8px solid #d35400; }
    h2 { margin: 0 0 12px; color: #17365d; }
    code { padding: 2px 5px; border-radius: 4px; background: #e8edf5; }
  </style>
</head>
<body>
  <header><strong>固定顶部栏 · Highlighter 自动长截图测试</strong></header>
  <main id="content"></main>
  <footer><span>固定底部栏</span><i id="pulse"></i></footer>
  <script>
    const content = document.getElementById('content')
    for (let index = 1; index <= 14; index++) {
      const section = document.createElement('section')
      section.innerHTML = `<h2>测试段落 ${index}</h2>
        <p>这是用于验证自动滚动、固定栏容错和相邻帧重叠识别的确定性内容。</p>
        <p>段落标识：<code>HIGH-LONG-${String(index).padStart(2, '0')}</code></p>
        <p>${'内容行 '.repeat(16)}</p>`
      content.append(section)
    }
  </script>
</body>
</html>
