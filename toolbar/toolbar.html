<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'">
<link rel="stylesheet" href="../shared/tokens.css">
<!--
  P0-1-T5 (S12): this window has no static copy — the whole strip is built by
  toolbar.js from action metadata — but the locale tables and the runtime still
  have to load before it so `t()` exists when the first selection arrives.
-->
<script src="../shared/locales/zh-CN.js"></script>
<script src="../shared/locales/en-US.js"></script>
<script src="../shared/locales/zh-TW.js"></script>
<script src="../shared/locales/toolbar.js"></script>
<script src="../shared/i18n.js"></script>
<style>
  /*
   * Selection toolbar · FILM “status LED + primary action”.
   *
   * This is the product's most-seen surface and the direction's whole premise:
   * it FLOATS OVER YOUR SCREEN, so it is built as real glass — a translucent
   * film, a blur of whatever is behind it, and a saturation lift. The window is
   * created with `transparent: true` (main/services/selection-window-manager.js),
   * so "behind it" includes the user's actual desktop, not just this document.
   *
   * Sizing: frameless, exactly the element, hasShadow:false. An OUTER box-shadow
   * would therefore be clipped by the window bounds and render as a rectangle,
   * which is why depth here is the inset-only --shadow-bevel. The translucent
   * film needs a hairline to end on (--glass-line) because blurred content has no
   * edge of its own.
   *
   * Fallback: if the platform cannot composite translucency the same declarations
   * still render — they read as a milky fill rather than a broken strip, because
   * the alpha is high enough to carry 12px text.
   */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: transparent; overflow: hidden; user-select: none; }
  .toolbar {
    display: flex; align-items: center; justify-content: center; gap: 3px;
    background: var(--glass-3);
    -webkit-backdrop-filter: blur(var(--glass-blur-3)) saturate(var(--glass-sat-3));
    backdrop-filter: blur(var(--glass-blur-3)) saturate(var(--glass-sat-3));
    border: 1px solid var(--glass-line); border-radius: var(--radius-lg);
    padding: 4px 6px;
    box-shadow: var(--shadow-bevel), var(--glass-hi);
    height: 40px; white-space: nowrap; width: 100%;
  }
  .toolbar .led {
    flex: 0 0 auto; width: 6px; height: 6px; border-radius: 2px;
    background: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft);
    margin: 0 5px 0 2px;
  }
  .toolbar .sep { flex: 0 0 1px; width: 1px; height: 16px; background: var(--line); margin: 0 2px; }
  /*
   * Buttons are translucent too. An opaque chip inside a glass strip reads as a
   * patch stuck on the glass — the strip's material has to continue through its
   * contents, which is exactly the difference between "a glass panel" and "a
   * panel with glass around the edges". Tints are white/orange mixes rather than
   * surface steps so they compose with whatever is behind the window.
   */
  .toolbar .btn {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    flex: 1 1 62px; min-width: 62px; max-width: 126px; height: 30px; padding: 5px 10px;
    border: 1px solid transparent; border-radius: var(--radius-sm);
    background: var(--btn-face); color: var(--text);
    font-size: 12px; font-weight: 500; cursor: pointer;
    transition: background var(--dur-hover) var(--ease-out), border-color var(--dur-hover) var(--ease-out), color var(--dur-hover) var(--ease-out);
    font-family: var(--font-ui);
    outline: none; overflow: hidden; text-overflow: ellipsis; -webkit-app-region: no-drag;
  }
  .toolbar .btn:hover { border-color: var(--glass-line); background: var(--btn-face-hover); color: var(--text); }
  .toolbar .btn:active { background: var(--btn-face-active); }
  /*
   * Icon role: a Bootstrap Icons asset painted through a mask, so the ink is
   * always currentColor and the primary button's inverted ink needs no
   * special case. 15px because the library draws to 87.5% of its 16px box
   * while the previous glyph work sat at ~80%, so the same box would read
   * larger than before.
   */
  .toolbar .toolbar-icon {
    flex: 0 0 auto; display: block; width: 15px; height: 15px;
    background: currentColor;
    -webkit-mask: var(--icon) center/contain no-repeat;
    mask: var(--icon) center/contain no-repeat;
  }
  /* A 16-character custom name must ellipsize rather than push the icon out. */
  .toolbar .btn .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toolbar .btn.pri {
    background: var(--primary); border-color: var(--primary);
    color: var(--primary-ink); font-weight: 600;
  }
  .toolbar .btn.pri:hover { filter: brightness(1.06); border-color: var(--primary); background: var(--primary); }
</style>
</head>
<body>
<div class="toolbar" id="toolbar"></div>
<script src="toolbar.js"></script>
</body>
</html>
