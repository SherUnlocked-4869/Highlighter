<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'">
<style>
  :root {
    --primary: #1677ff;
    --bg: #f5f5f5;
    --text: #1f1f1f;
    --line: #e8e8e8;
  }
  body.dark {
    --bg: #121316;
    --text: #f0f0f0;
    --line: #303239;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: transparent; overflow: hidden; user-select: none; }
  .toolbar {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    background: var(--bg); backdrop-filter: blur(16px);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 5px 8px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), inset 0 -1px 0 rgba(0, 0, 0, 0.12);
    height: 40px; white-space: nowrap; width: 100%;
  }
  .toolbar .sep { flex: 0 0 1px; width: 1px; height: 20px; background: var(--line); }
  .toolbar .btn {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    flex: 1 1 62px; min-width: 62px; max-width: 126px; height: 28px; padding: 5px 6px;
    border: none; border-radius: 7px; background: transparent; color: var(--text);
    font-size: 13px; cursor: pointer; transition: all 0.15s; white-space: nowrap;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    outline: none; overflow: hidden; text-overflow: ellipsis; -webkit-app-region: no-drag;
  }
  .toolbar .btn:hover { background: color-mix(in srgb, var(--primary) 10%, transparent); color: var(--text); }
  .toolbar .btn:active { background: color-mix(in srgb, var(--primary) 16%, transparent); }
</style>
</head>
<body>
<div class="toolbar" id="toolbar"></div>
<script src="toolbar.js"></script>
</body>
</html>
