<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  /* Palette comes from shared/tokens.css. The window is frameless, transparent
     and sized exactly to the toolbar with hasShadow:false, so any outer
     box-shadow would be clipped by the window bounds. Depth is therefore drawn
     as an inset highlight/shade pair that stays inside the element. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: transparent; overflow: hidden; user-select: none; }
  .toolbar {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    background: var(--surface); backdrop-filter: blur(16px);
    border: 1px solid var(--line-2); border-radius: var(--radius-lg);
    padding: 5px 8px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .10), inset 0 -1px 0 rgba(0, 0, 0, .14);
    height: 40px; white-space: nowrap; width: 100%;
  }
  .toolbar .sep { flex: 0 0 1px; width: 1px; height: 20px; background: var(--line); }
  .toolbar .btn {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    flex: 1 1 62px; min-width: 62px; max-width: 126px; height: 28px; padding: 5px 6px;
    border: none; border-radius: var(--radius-sm); background: transparent; color: var(--text);
    font-size: 13px; cursor: pointer; transition: background .14s; white-space: nowrap;
    font-family: var(--font-ui);
    outline: none; overflow: hidden; text-overflow: ellipsis; -webkit-app-region: no-drag;
  }
  .toolbar .btn:hover { background: var(--primary-soft); color: var(--text); }
  .toolbar .btn:active { background: var(--surface-3); }
</style>
</head>
<body>
<div class="toolbar" id="toolbar"></div>
<script src="toolbar.js"></script>
</body>
</html>
