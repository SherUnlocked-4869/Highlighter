<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: transparent; overflow: hidden; user-select: none; }
  .toolbar {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    background: rgba(28, 28, 38, 0.96); backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px;
    padding: 5px 8px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), inset 0 -1px 0 rgba(0, 0, 0, 0.22);
    height: 40px; white-space: nowrap; width: 100%;
  }
  .toolbar .sep { flex: 0 0 1px; width: 1px; height: 20px; background: rgba(255, 255, 255, 0.1); }
  .toolbar .btn {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    flex: 1 1 62px; min-width: 62px; max-width: 126px; height: 28px; padding: 5px 6px;
    border: none; border-radius: 7px; background: transparent; color: #d0d0e0;
    font-size: 13px; cursor: pointer; transition: all 0.15s; white-space: nowrap;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    outline: none; overflow: hidden; text-overflow: ellipsis; -webkit-app-region: no-drag;
  }
  .toolbar .btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
  .toolbar .btn:active { background: rgba(255, 255, 255, 0.15); }
  .toolbar .btn-copy { color: #86efac; }
  .toolbar .btn-copy:hover { background: rgba(134, 239, 172, 0.14); color: #bbf7d0; }
  .toolbar .btn-search { color: #facc15; }
  .toolbar .btn-search:hover { background: rgba(250, 204, 21, 0.14); color: #fde047; }
  .toolbar .btn-translate { color: #6c63ff; }
  .toolbar .btn-translate:hover { background: rgba(108, 99, 255, 0.15); color: #7c73ff; }
  .toolbar .btn-explain { color: #4fc3f7; }
  .toolbar .btn-explain:hover { background: rgba(79, 195, 247, 0.15); color: #6fd3ff; }
  .toolbar .btn-custom { color: #f0abfc; }
  .toolbar .btn-custom:hover { background: rgba(240, 171, 252, 0.15); color: #f5d0fe; }
</style>
</head>
<body>
<div class="toolbar" id="toolbar"></div>
<script src="toolbar.js"></script>
</body>
</html>
